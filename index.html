/* ============================ SYNC (GitHub private repo) ============================
   The app stays offline-first: everything works with no network, and sync is a
   background reconcile on top. Data lives in a file in a PRIVATE repo, reached
   with a fine-grained token scoped to that one repo. The token is stored on this
   device only and is never part of the synced data.                            */
const SYNC_KEY = "expense-sync-v1";

function b64encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64decode(b64){
  const bin = atob(String(b64).replace(/\s/g, ""));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
/* savedAt changes on every local save; comparing it would make every sync think
   there's something to push and ping-pong forever. */
function syncFingerprint(s){
  if (!s) return "";
  const c = JSON.parse(JSON.stringify(s));
  if (c.meta) delete c.meta.savedAt;   // changes on every local save; not a real difference
  return JSON.stringify(canonical(normalizeState(c)));
}

const Sync = {
  cfg: null, sha: null, busy: false, timer: null, poll: null,
  status: "off", error: "", lastAt: 0,

  load(){
    try { this.cfg = JSON.parse(localStorage.getItem(SYNC_KEY) || "null"); }
    catch(e){ this.cfg = null; }
    if (this.cfg) this.status = "idle";
    return this.cfg;
  },
  save(cfg){ this.cfg = cfg; localStorage.setItem(SYNC_KEY, JSON.stringify(cfg)); },
  disconnect(){
    this.cfg = null; this.sha = null; this.status = "off"; this.error = "";
    localStorage.removeItem(SYNC_KEY);
    if (this.poll) { clearInterval(this.poll); this.poll = null; }
    paintSync();
  },
  on(){ return !!(this.cfg && this.cfg.token); },

  api(path, opts){
    return fetch("https://api.github.com" + path, Object.assign({
      cache: "no-store",
      headers: {
        "Authorization": "Bearer " + this.cfg.token,
        "Accept": "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28"
      }
    }, opts || {}));
  },
  async fail(r){
    let detail = "";
    try { detail = (await r.json()).message || ""; } catch(e){}
    if (r.status === 401) return "Token rejected — it may have been revoked. Set up sync again.";
    if (r.status === 403) return "GitHub refused the request" + (detail ? ": " + detail : "")
                               + ". Check the token has Contents read & write on this repo.";
    if (r.status === 404) return "Repo or file not found. Check the owner/repo name, and that the "
                               + "token lists this repo under its repository access.";
    return "GitHub error " + r.status + (detail ? ": " + detail : "");
  },
  filePath(){
    const c = this.cfg;
    return "/repos/" + encodeURIComponent(c.owner) + "/" + encodeURIComponent(c.repo)
         + "/contents/" + c.path.split("/").map(encodeURIComponent).join("/");
  },

  async pull(){
    const r = await this.api(this.filePath() + "?ref=" + encodeURIComponent(this.cfg.branch || "main"));
    if (r.status === 404){ this.sha = null; return null; }        // first run: no file yet
    if (!r.ok) throw new Error(await this.fail(r));
    const j = await r.json();
    this.sha = j.sha;
    if (!j.content && j.size > 0)
      throw new Error("Data file is too large for this sync method (" + j.size + " bytes).");
    if (!j.content) return null;
    const parsed = JSON.parse(b64decode(j.content));
    return migrate(parsed);
  },

  async push(s, retrying){
    const body = {
      message: "expenses " + new Date().toISOString().slice(0,16).replace("T"," "),
      content: b64encode(JSON.stringify(s, null, 1))
    };
    if (this.sha) body.sha = this.sha;
    if (this.cfg.branch) body.branch = this.cfg.branch;
    const r = await this.api(this.filePath(), { method: "PUT", body: JSON.stringify(body) });
    if ((r.status === 409 || r.status === 422) && !retrying){
      // Someone else wrote in between. Re-read, merge on top, try once more.
      const remote = await this.pull();
      const merged = mergeStates(s, remote);
      return this.push(merged, true);
    }
    if (!r.ok) throw new Error(await this.fail(r));
    const j = await r.json();
    this.sha = j.content && j.content.sha;
    return s;
  },

  async run(){
    if (!this.on() || this.busy) return;
    if (!navigator.onLine){ this.status = "offline"; paintSync(); return; }
    this.busy = true; this.status = "syncing"; this.error = ""; paintSync();
    try {
      const remote = await this.pull();
      // Nothing stored on this device — a new phone, or storage the browser
      // cleared. Whatever is in the cloud becomes this device's data.
      if (!state){
        if (remote){
          state = remote;
          rolloverIfNeeded(state); refreshArchive(state);
          await Store.save(state);
          render();
        }
        this.status = "ok"; this.lastAt = Date.now();
        this.busy = false; paintSync();
        return;
      }
      let merged = mergeStates(state, remote);
      rolloverIfNeeded(merged); refreshArchive(merged);
      const before = syncFingerprint(state), after = syncFingerprint(merged);
      if (syncFingerprint(remote) !== after) merged = await this.push(merged);
      if (before !== after){                      // remote brought something new
        state = merged;
        await Store.save(state);
        render();
      } else {
        state = merged;
      }
      this.status = "ok"; this.lastAt = Date.now();
    } catch(e){
      this.status = "error"; this.error = e.message || String(e);
      console.warn("Sync failed:", e);
    }
    this.busy = false; paintSync();
  },

  start(){
    if (!this.on()) return;
    if (this.poll) clearInterval(this.poll);
    this.poll = setInterval(() => { if (!document.hidden) this.run(); }, 25000);
    this.run();
  }
};

function queueSync(){
  if (!Sync.on()) return;
  clearTimeout(Sync.timer);
  Sync.timer = setTimeout(() => Sync.run(), 1200);
}
function agoText(ms){
  const s = Math.round((Date.now() - ms) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s/60) + "m ago";
  return Math.floor(s/3600) + "h ago";
}
function paintSync(){
  const el = document.getElementById("syncInd");
  if (!el) return;
  const st = Sync.status;
  el.className = "save-ind" + (st === "error" ? " err" : "");
  el.textContent = !Sync.on() ? ""
    : st === "syncing" ? "· syncing…"
    : st === "error"   ? "· sync failed"
    : st === "offline" ? "· offline"
    : Sync.lastAt ? "· synced " + agoText(Sync.lastAt) : "· sync on";
  el.title = st === "error" ? Sync.error : "";
}

function dlgSync(){
  const c = Sync.cfg || { owner:"", repo:"expense-tracker-data", path:"data.json", branch:"main", token:"" };
  dlg.innerHTML = `<form method="dialog"><h3>Sync across devices</h3>
    <p style="color:var(--muted);font-size:13px;margin-top:0">
      Keeps this device in step with your phone through a <strong>private</strong> GitHub repo.
      Paste a fine-grained token that can read &amp; write contents on that one repo — see
      SETUP-SYNC.md for the exact steps. The token stays on this device.</p>
    <label><span>GitHub token</span>
      <input name="token" type="password" autocomplete="off" spellcheck="false"
        placeholder="github_pat_…" value="${esc(c.token)}"></label>
    <label><span>Private repo name</span>
      <input name="repo" type="text" autocomplete="off" spellcheck="false" value="${esc(c.repo)}"></label>
    <label><span>File inside the repo</span>
      <input name="path" type="text" autocomplete="off" spellcheck="false" value="${esc(c.path)}"></label>
    <div class="err" id="d-err"></div>
    <div class="dlg-actions">
      ${Sync.on() ? `<button type="button" class="btn danger spacer" data-off>Turn sync off</button>` : ""}
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn primary">Connect</button></div></form>`;
  dlg.querySelector("[data-close]").onclick = closeDlg;
  const off = dlg.querySelector("[data-off]");
  if (off) off.onclick = () => { Sync.disconnect(); closeDlg(); render(); };

  dlg.querySelector("form").onsubmit = async e => {
    e.preventDefault();
    const err = dlg.querySelector("#d-err");
    const btn = dlg.querySelector("[type=submit]");
    const f = e.target;
    const token = f.token.value.trim(), repo = f.repo.value.trim(), path = f.path.value.trim();
    if (!token) return err.textContent = "Paste your token.";
    if (!repo)  return err.textContent = "Name the private repo.";
    if (!path)  return err.textContent = "Name the file, e.g. data.json";
    err.textContent = ""; btn.disabled = true; btn.textContent = "Checking…";
    const prev = Sync.cfg;
    try {
      Sync.cfg = { token, repo, path, branch:"main", owner:"" };
      const who = await Sync.api("/user");
      if (!who.ok) throw new Error(await Sync.fail(who));
      Sync.cfg.owner = (await who.json()).login;
      const probe = await Sync.api("/repos/" + encodeURIComponent(Sync.cfg.owner) + "/" + encodeURIComponent(repo));
      if (!probe.ok) throw new Error(await Sync.fail(probe));
      const info = await probe.json();
      Sync.cfg.branch = info.default_branch || "main";
      if (!info.private && !confirm("Heads up: “" + repo + "” is a PUBLIC repo, so your spending "
          + "would be visible to anyone.\n\nUse it anyway?")) throw new Error("Cancelled — make the repo private first.");
      Sync.save(Sync.cfg);
      closeDlg();
      await Sync.run();
      Sync.start();
      render();
      if (Sync.status === "error") alert("Connected, but the first sync failed:\n\n" + Sync.error);
    } catch(ex){
      Sync.cfg = prev;
      err.textContent = ex.message || String(ex);
      btn.disabled = false; btn.textContent = "Connect";
    }
  };
  dlg.showModal();
  const first = dlg.querySelector("input"); if (first) first.focus();
}

  const mig = migrate(old);

  ok(Array.isArray(mig.archive), "17b. archive array added");
  ok(mig.meta.lastSeenMonth === curYm(), "17c. lastSeenMonth seeded");
  ok(mig.meta.lastBackupMonth === undefined, "17d. obsolete field dropped");
  eq(curBalance(mig), 19900, "17e. balance survives migration");

  /* ---- editing entries ---- */
  const owedFix = (amt,rem,st) => ({ id:"o1", label:"R", amount:amt, remaining:rem,
                                     dateAdded:T, status:st||"open", note:"", dateClosed:null });
  s = base(); s.owed.push(owedFix(50000,50000));
  rec(s, s.owed[0], 20000, T);
  eq(receivedFor(s,"o1"), 20000, "18a. payments totalled per owed entry");
  eq(s.owed[0].remaining, 30000, "18b. outstanding derived from payments");
  // edit that payment upward
  s.transactions.find(t=>t.type==="received").amount = 35000;
  syncOwed(s, s.owed[0]);
  eq(s.owed[0].remaining, 15000, "18c. editing a payment re-derives outstanding");
  eq(s.owed[0].status, "open", "18d. still open after a bigger part payment");
  eq(curBalance(s), 135000, "18e. balance follows the edited payment");
  // edit it to settle the whole thing
  s.transactions.find(t=>t.type==="received").amount = 50000;
  syncOwed(s, s.owed[0]);
  eq(s.owed[0].remaining, 0, "18f. paying it off closes the entry");
  eq(s.owed[0].status, "received", "18g. status flips to received");

  // undo a payment -> entry reopens, balance drops
  s = base(); s.owed.push(owedFix(50000,50000));
  let avBefore2 = available(s);
  rec(s, s.owed[0], 50000, T);
  eq(s.owed[0].status, "received", "19a. fully received");
  s.transactions = s.transactions.filter(t => t.type !== "received");
  syncOwed(s, s.owed[0]);
  eq(s.owed[0].status, "open", "19b. undo reopens the entry");
  eq(s.owed[0].remaining, 50000, "19c. full amount owed again");
  eq(curBalance(s), 100000, "19d. money comes back out of the balance");
  eq(available(s), avBefore2, "19e. available lands back where it started");

  // editing the owed total keeps payments intact
  s = base(); s.owed.push(owedFix(50000,50000));
  rec(s, s.owed[0], 20000, T);
  s.owed[0].amount = 30000; syncOwed(s, s.owed[0]);
  eq(s.owed[0].remaining, 10000, "20a. lowering the total re-derives outstanding");
  s.owed[0].amount = 20000; syncOwed(s, s.owed[0]);
  eq(s.owed[0].status, "received", "20b. total equal to paid closes it");
  eq(receivedFor(s,"o1"), 20000, "20c. payments untouched by editing the total");

  // reopening a written-off entry
  s = base(); s.owed.push(owedFix(50000,0,"writtenOff"));
  eq(owedTotal(s), 0, "21a. written off counts for nothing");
  s.owed[0].status = "open"; s.owed[0].dateClosed = null; syncOwed(s, s.owed[0]);
  eq(s.owed[0].remaining, 50000, "21b. reopening restores the full amount");
  eq(owedTotal(s), 50000, "21c. back in the owed total");

  // self-heal on load: a stored remaining that disagrees with the payments
  s = base(); s.owed.push(owedFix(50000,50000));
  rec(s, s.owed[0], 20000, T);
  s.owed[0].remaining = 99999;                       // corrupted by hand
  const healed = migrate(JSON.parse(JSON.stringify(s)));
  eq(healed.owed[0].remaining, 30000, "22a. loading repairs a wrong outstanding amount");
  eq(healed.owed[0].status, "open", "22b. status repaired too");

  // editing an entry in an archived month updates the archive
  s = base(); s.meta.lastSeenMonth = "2026-07";
  s.transactions.push({id:"e1",type:"expense",categoryId:"c1",amount:4000,date:"2026-07-05",note:""});
  rolloverIfNeeded(s, "2026-08");
  eq(s.archive[0].spent, 4000, "23a. archived with the original figure");
  s.transactions.find(t=>t.id==="e1").amount = 9000;
  refreshArchive(s);
  eq(s.archive[0].spent, 9000, "23b. editing a past entry updates the archive");
  eq(s.archive[0].closingBalance, 91000, "23c. closing balance recalculated");
  s.transactions = s.transactions.filter(t => t.id !== "e1");
  refreshArchive(s);
  eq(s.archive[0].spent, 0, "23d. deleting a past entry updates the archive");
  eq(s.archive.length, 1, "23e. the month stays archived");

  // zero-allowing parser for the balance floor / starting balance
  eq(parseAmountOrZero("0"), 0, "24a. zero accepted");
  eq(parseAmountOrZero("1500"), 150000, "24b. plain amount");
  eq(parseAmountOrZero("-200"), -20000, "24c. negative accepted");
  eq(parseAmountOrZero("₹1,500.50"), 150050, "24d. symbols and commas stripped");
  eq(parseAmountOrZero(""), null, "24e. blank rejected");
  eq(parseAmountOrZero("abc"), null, "24f. text rejected");
  eq(parseAmountOrZero("1.234"), null, "24g. 3 decimals rejected");

  /* ---- tombstones ---- */
  s = base();
  s.transactions.push({id:"t1",type:"expense",categoryId:"c1",amount:5000,date:T,updatedAt:10});
  s.transactions.push({id:"t2",type:"expense",categoryId:"c1",amount:3000,date:T,updatedAt:10,deleted:true});
  eq(curBalance(s), 95000, "25a. deleted rows are ignored by the balance");
  eq(monthSpent(s,"2026-08",null), 5000, "25b. and by month totals");
  eq(txns(s).length, 1, "25c. and by every list view");
  s.owed.push({id:"o1",label:"X",amount:9000,remaining:9000,dateAdded:T,status:"open",updatedAt:1,deleted:true});
  eq(owedTotal(s), 0, "25d. deleted owed rows don't count");

  /* ---- merge ---- */
  const dev = (rows, extra) => Object.assign({ version:3,
    settings:{ minBalance:20000, includeOwed:true, updatedAt:100 },
    categories:[{id:"c1",name:"Mess",archived:false,updatedAt:1}],
    transactions:rows||[], owed:[], archive:[], laundryBudgets:[], owedGroups:[],
    meta:{ initialBalance:100000, initialBalanceUpdatedAt:100, createdAt:"2026-08-01",
           lastSeenMonth:"2026-08", savedAt:"" } }, extra||{});
  const ex = (id, amt, ts, del) => ({ id, type:"expense", categoryId:"c1", amount:amt,
                                      date:T, note:"", updatedAt:ts, deleted:del });

  // each device added a different expense — both must survive
  let A = dev([ex("a",1000,10)]), B = dev([ex("b",2000,20)]);
  let M = mergeStates(A, B);
  eq(M.transactions.length, 2, "26a. both devices' new entries survive");
  eq(monthSpent(M,"2026-08",null), 3000, "26b. totals include both");
  eq(syncFingerprint(mergeStates(A,B)), syncFingerprint(mergeStates(B,A)), "26c. merge order doesn't matter");

  // same row edited on both — newest edit wins
  A = dev([ex("a",1000,10)]); B = dev([ex("a",7000,50)]);
  eq(mergeStates(A,B).transactions[0].amount, 7000, "27a. newer edit wins");
  eq(mergeStates(B,A).transactions[0].amount, 7000, "27b. regardless of merge direction");
  A = dev([ex("a",1000,90)]); B = dev([ex("a",7000,50)]);
  eq(mergeStates(A,B).transactions[0].amount, 1000, "27c. older edit loses");

  // a delete on one device must not be resurrected by the other
  A = dev([ex("a",1000,10,true)]); B = dev([ex("a",1000,5)]);
  eq(mergeStates(A,B).transactions[0].deleted, true, "28a. delete beats an older edit");
  eq(monthSpent(mergeStates(A,B),"2026-08",null), 0, "28b. deleted entry stays gone");
  A = dev([ex("a",1000,10,true)]); B = dev([ex("a",4000,80)]);
  eq(mergeStates(A,B).transactions[0].amount, 4000, "28c. but a later edit un-deletes it");
  eq(mergeStates(A,B).transactions[0].deleted, undefined, "28d. tombstone cleared by that edit");

  // identical timestamps must resolve the same way on both devices
  A = dev([ex("a",1000,42)]); B = dev([ex("a",2000,42)]);
  eq(mergeStates(A,B).transactions[0].amount, mergeStates(B,A).transactions[0].amount,
     "29a. timestamp ties break identically on both sides");

  // settings and starting balance follow the newer change
  A = dev([], { settings:{minBalance:20000,includeOwed:true,updatedAt:100} });
  B = dev([], { settings:{minBalance:50000,includeOwed:false,updatedAt:200} });
  eq(mergeStates(A,B).settings.minBalance, 50000, "30a. newer settings win");
  eq(mergeStates(A,B).settings.includeOwed, false, "30b. including the owed toggle");
  A = dev([], { meta:{initialBalance:100000,initialBalanceUpdatedAt:100,createdAt:"2026-08-01",lastSeenMonth:"2026-08",savedAt:""} });
  B = dev([], { meta:{initialBalance:700000,initialBalanceUpdatedAt:300,createdAt:"2026-08-01",lastSeenMonth:"2026-09",savedAt:""} });
  M = mergeStates(A,B);
  eq(M.meta.initialBalance, 700000, "30c. newer starting balance wins");
  eq(M.meta.lastSeenMonth, "2026-09", "30d. furthest-along month wins");

  // owed outstanding is re-derived from whatever payments merged in
  A = dev([]); A.owed = [{id:"o1",label:"R",amount:50000,remaining:50000,dateAdded:T,status:"open",updatedAt:1}];
  B = dev([{id:"p1",type:"received",owedId:"o1",amount:20000,date:T,note:"R",updatedAt:9}]);
  B.owed = [{id:"o1",label:"R",amount:50000,remaining:50000,dateAdded:T,status:"open",updatedAt:1}];
  M = mergeStates(A,B);
  eq(M.owed[0].remaining, 30000, "31a. a payment synced from the phone reduces what's outstanding");
  eq(curBalance(M), 120000, "31b. and raises the balance");
  eq(available(M), curBalance(A) - 20000 + 50000, "31c. available unchanged by the payment");

  // merging is idempotent — syncing twice changes nothing
  eq(syncFingerprint(mergeStates(M, M)), syncFingerprint(M), "32a. merging with itself is a no-op");
  eq(syncFingerprint(mergeStates(mergeStates(A,B), B)), syncFingerprint(mergeStates(A,B)),
     "32b. re-merging the same remote changes nothing");

  // archive months union, with figures recomputed from merged entries
  A = dev([ex("j1",4000,10)]); A.transactions[0].date = "2026-07-05";
  A.archive = [{ym:"2026-07",spent:4000,entries:1,closedAt:"2026-08-01",byCategory:[],days:31,perDay:129,added:0,closingBalance:96000}];
  B = dev([ex("j2",6000,20)]); B.transactions[0].date = "2026-07-09";
  B.archive = [{ym:"2026-07",spent:6000,entries:1,closedAt:"2026-08-01",byCategory:[],days:31,perDay:193,added:0,closingBalance:94000}];
  M = mergeStates(A,B);
  eq(M.archive.length, 1, "33a. the same archived month isn't duplicated");
  eq(M.archive[0].spent, 10000, "33b. archive figures recomputed from both devices' entries");
  eq(M.archive[0].entries, 2, "33c. entry count reflects the merge");

  // legacy data with no timestamps still merges without losing rows
  const legacy = migrate({ version:2, settings:{minBalance:1000,includeOwed:true},
    categories:[{id:"c1",name:"Mess"}], owed:[],
    transactions:[{id:"old",type:"expense",categoryId:"c1",amount:500,date:T}],
    meta:{initialBalance:5000,savedAt:"2026-08-01T00:00:00.000Z"} });
  eq(typeof legacy.transactions[0].updatedAt, "number", "34a. old rows get a timestamp on load");
  eq(legacy.version, 3, "34b. migrated to v3");
  M = mergeStates(legacy, dev([ex("new",100,999)]));
  eq(M.transactions.length, 2, "34c. legacy rows survive a merge with a newer device");

  // base64 round-trip must survive the rupee sign and other non-ASCII
  const tricky = JSON.stringify({ note:"chai ₹12 — Nescafé", emoji:"🍵" });
  eq(b64decode(b64encode(tricky)), tricky, "35a. UTF-8 survives the base64 round-trip");
  eq(b64decode(b64encode("")), "", "35b. empty string round-trips");

  /* ---- essentials ---- */
  const ess = (id, amt, ts, date) => ({ id, type:"essential", amount:amt, date:date||T, note:"", updatedAt:ts||1 });
  s = base();
  s.transactions.push(ess("x1", 30000));
  eq(curBalance(s), 70000, "36a. an essential comes out of current balance");
  eq(monthSpent(s,"2026-08",null), 0, "36b. but not out of monthly spending");
  eq(spendPerDay(s,"2026-08",null,T), 0, "36c. nor the per-day figure");
  eq(typeTotal(s,"essential","2026-08"), 30000, "36d. it has its own total");
  eq(monthAdded(s,"2026-08"), 0, "36e. and isn't counted as money added");
  // with the owed entry it creates, available is unmoved
  const avBase = available(base());
  s.owed.push({id:"o9",label:"Essentials",amount:30000,remaining:30000,dateAdded:T,status:"open",note:"",updatedAt:1});
  eq(available(s), avBase, "36f. essential + its owed entry leaves available unchanged");
  eq(owedTotal(s), 30000, "36g. the owed entry stands on its own");
  // deleting the essential must not disturb the owed entry (they're independent)
  tombstone(s.transactions.find(t=>t.id==="x1"));
  eq(curBalance(s), 100000, "36h. deleting the essential restores the balance");
  eq(owedTotal(s), 30000, "36i. and leaves the owed entry alone");

  /* ---- laundry ---- */
  s = base(); s.laundryBudgets = [{ id:"2026-08", amount:50000, updatedAt:1 }];
  const cur0 = curBalance(s), av0 = available(base());
  eq(curBalance(s), cur0, "37a. setting an amount aside doesn't touch current");
  eq(available(s), av0 - 50000, "37b. but does hold it back from available");
  eq(laundryHeld(s,"2026-08"), 50000, "37c. all of it is held while unspent");
  // spending from it: current down, available unmoved
  s.transactions.push({id:"l1",type:"laundry",amount:20000,date:T,note:"",updatedAt:1});
  eq(curBalance(s), cur0 - 20000, "37d. spending it lowers current");
  eq(available(s), av0 - 50000, "37e. and leaves available exactly where it was");
  eq(laundryHeld(s,"2026-08"), 30000, "37f. the held amount shrinks as you spend");
  eq(monthSpent(s,"2026-08",null), 0, "37g. laundry stays out of monthly spending");
  eq(typeTotal(s,"laundry","2026-08"), 20000, "37h. it has its own total");
  // spending it all: still no change to available
  s.transactions.push({id:"l2",type:"laundry",amount:30000,date:T,note:"",updatedAt:1});
  eq(available(s), av0 - 50000, "37i. spending the lot still leaves available alone");
  eq(laundryHeld(s,"2026-08"), 0, "37j. nothing left held back");
  // overspending: only the excess bites
  s.transactions.push({id:"l3",type:"laundry",amount:10000,date:T,note:"",updatedAt:1});
  eq(laundryHeld(s,"2026-08"), 0, "37k. can't hold back less than nothing");
  eq(available(s), av0 - 60000, "37l. going over cuts available by the excess only");
  eq(curBalance(s), cur0 - 60000, "37m. current is down by everything spent");

  // the amount carries forward into later months
  s = base(); s.laundryBudgets = [{ id:"2026-06", amount:40000, updatedAt:1 }];
  eq(laundryBudget(s,"2026-08"), 40000, "38a. an unset month inherits the last one set");
  eq(laundryBudget(s,"2026-05"), 0, "38b. months before the first stay at nothing");
  s.laundryBudgets.push({ id:"2026-08", amount:70000, updatedAt:2 });
  eq(laundryBudget(s,"2026-08"), 70000, "38c. an explicit amount wins for its own month");
  eq(laundryBudget(s,"2026-07"), 40000, "38d. earlier months keep the older amount");
  eq(laundryBudget(s,"2026-09"), 70000, "38e. later months inherit the newest");
  // a new month resets what's been spent, so the whole amount is held again
  s.transactions.push({id:"l1",type:"laundry",amount:70000,date:"2026-08-04",note:"",updatedAt:1});
  eq(laundryHeld(s,"2026-08"), 0, "38f. August fully spent");
  eq(laundryHeld(s,"2026-09"), 70000, "38g. September starts with the full amount held");

  // budgets merge across devices like any other row
  A = dev([]); A.laundryBudgets = [{ id:"2026-08", amount:50000, updatedAt:10 }];
  B = dev([]); B.laundryBudgets = [{ id:"2026-08", amount:80000, updatedAt:20 },
                                   { id:"2026-09", amount:90000, updatedAt:20 }];
  M = mergeStates(A,B);
  eq(laundryBudget(M,"2026-08"), 80000, "39a. the newer amount wins on merge");
  eq(laundryBudget(M,"2026-09"), 90000, "39b. a month only one device knew about survives");
  eq(syncFingerprint(mergeStates(A,B)), syncFingerprint(mergeStates(B,A)), "39c. still order-independent");

  // archive records both side sections
  s = base(); s.meta.lastSeenMonth = "2026-07";
  s.transactions.push({id:"e7",type:"expense",categoryId:"c1",amount:4000,date:"2026-07-05",updatedAt:1});
  s.transactions.push(ess("s7", 9000, 1, "2026-07-08"));
  s.transactions.push({id:"l7",type:"laundry",amount:2000,date:"2026-07-09",note:"",updatedAt:1});
  rolloverIfNeeded(s, "2026-08");
  eq(s.archive[0].spent, 4000, "40a. archived spending excludes the side sections");
  eq(s.archive[0].essentials, 9000, "40b. essentials archived separately");
  eq(s.archive[0].laundry, 2000, "40c. laundry archived separately");
  eq(s.archive[0].added, 0, "40d. neither counts as money added");
  eq(s.archive[0].closingBalance, 100000-4000-9000-2000, "40e. closing balance nets all three");

  /* ---- saved lists of owed entries ---- */
  const owedFix2 = (id,label,amt) => ({ id, label, amount:amt, remaining:amt, dateAdded:T,
                                        status:"open", note:"", dateClosed:null, updatedAt:1 });
  const mkGroup = (st, ids, name) => {
    const items = ids.map(i => { const o = st.owed.find(x=>x.id===i);
                                 return { owedId:i, label:o.label, amount:o.remaining }; });
    const g = { id:"g1", name:name||"list", items, total:items.reduce((a,i)=>a+i.amount,0),
                createdAt:T, status:"open", collectedAt:null, updatedAt:1 };
    st.owedGroups.push(g); return g;
  };
  const collect = (st, g) => {           // mirrors collectGroup() without the confirm
    for (const it of g.items){
      st.transactions.push({id:uid(),type:"received",owedId:it.owedId,amount:it.amount,date:T,note:it.label,updatedAt:1});
      const o = st.owed.find(x => x.id === it.owedId && !x.deleted);
      if (o) syncOwed(st, o);
    }
    g.status = "collected"; g.collectedAt = T; return g;
  };

  s = base();
  s.owed.push(owedFix2("o1","Rahul — dinner",26000));
  s.owed.push(owedFix2("o2","Aman — books",80000));
  s.owed.push(owedFix2("o3","Mess split",15000));
  let g = mkGroup(s, ["o1","o2","o3"], "12 Aug");
  eq(g.total, 121000, "41a. list total is the sum of its items");
  eq(groupText(g), "Rahul — dinner -> ₹260\nAman — books -> ₹800\nMess split -> ₹150\nTotal -> ₹1,210",
     "41b. text is item -> amount per line, total last");
  eq(owedTotal(s), 121000, "41c. saving a list doesn't change what's owed");
  eq(curBalance(s), 100000, "41d. nor the balance");

  // collecting the whole list at once
  let avB2 = available(s), curB2 = curBalance(s);
  collect(s, g);
  eq(curBalance(s), curB2 + 121000, "42a. collecting adds the total to current");
  eq(owedTotal(s), 0, "42b. and settles every entry in it");
  eq(available(s), avB2, "42c. available is unchanged, same as a single Received");
  eq(s.owed.filter(o=>o.status==="received").length, 3, "42d. all three marked received");
  eq(g.status, "collected", "42e. the list is marked collected");
  eq(txns(s).filter(t=>t.type==="received").length, 3, "42f. one payment recorded per item");

  // removing a list must not disturb the owed entries
  s = base();
  s.owed.push(owedFix2("o1","Rahul",26000));
  s.owed.push(owedFix2("o2","Aman",80000));
  g = mkGroup(s, ["o1","o2"]);
  tombstone(g);
  eq(groupRows(s).length, 0, "43a. the list is gone");
  eq(owedTotal(s), 106000, "43b. the entries it held are untouched");
  eq(owedRows(s).filter(o=>o.status==="open").length, 2, "43c. and still open");
  eq(curBalance(s), 100000, "43d. balance unaffected");

  // a partly-paid entry goes into the list at what's outstanding
  s = base();
  s.owed.push(owedFix2("o1","Aman",80000));
  rec(s, s.owed[0], 30000, T);
  g = mkGroup(s, ["o1"]);
  eq(g.items[0].amount, 50000, "44a. the list takes the outstanding amount, not the original");
  eq(g.total, 50000, "44b. total matches");
  collect(s, g);
  eq(owedTotal(s), 0, "44c. collecting clears the rest");
  eq(receivedFor(s,"o1"), 80000, "44d. payments add up to the full amount owed");

  // frozen amounts: an entry settled separately is still collected at the saved figure
  s = base();
  s.owed.push(owedFix2("o1","Rahul",26000));
  s.owed.push(owedFix2("o2","Aman",80000));
  g = mkGroup(s, ["o1","o2"]);
  rec(s, s.owed.find(o=>o.id==="o1"), 26000, T);      // paid on its own afterwards
  const curMid = curBalance(s);
  collect(s, g);
  eq(curBalance(s), curMid + 106000, "45a. frozen list collects its saved total regardless");
  eq(owedTotal(s), 0, "45b. everything ends up settled");
  eq(g.total, 106000, "45c. the saved total never changed");

  // lists merge across devices like any other row
  A = dev([]); A.owedGroups = [{ id:"g1", name:"mine", items:[], total:0, createdAt:T,
                                 status:"open", collectedAt:null, updatedAt:10 }];
  B = dev([]); B.owedGroups = [{ id:"g1", name:"mine", items:[], total:0, createdAt:T,
                                 status:"collected", collectedAt:T, updatedAt:20 },
                               { id:"g2", name:"phone list", items:[], total:0, createdAt:T,
                                 status:"open", collectedAt:null, updatedAt:20 }];
  M = mergeStates(A,B);
  eq(M.owedGroups.length, 2, "46a. a list made on the phone survives the merge");
  eq(M.owedGroups.find(x=>x.id==="g1").status, "collected", "46b. the newer state of a list wins");
  eq(syncFingerprint(mergeStates(A,B)), syncFingerprint(mergeStates(B,A)), "46c. still order-independent");

  /* ---- credit card ---- */
  const card = (id, amt, paid, date) => ({ id, type:"card", amount:amt, date:date||T,
                                           note:"", paid:!!paid, updatedAt:1 });
  s = base();
  const cur47 = curBalance(s), av47 = available(s);
  s.transactions.push(card("k1", 25000));
  eq(curBalance(s), cur47, "47a. an unpaid charge leaves current alone");
  eq(available(s), av47 - 25000, "47b. but comes straight out of available");
  eq(cardPending(s), 25000, "47c. it shows as pending");
  eq(monthSpent(s,"2026-08",null), 0, "47d. stays out of monthly spending");
  eq(spendPerDay(s,"2026-08",null,T), 0, "47e. and the per-day figure");
  eq(monthAdded(s,"2026-08"), 0, "47f. and is NOT counted as money coming in");

  // paying it: the mirror image
  s.transactions[0].paid = true;
  eq(curBalance(s), cur47 - 25000, "48a. paying takes it out of current");
  eq(available(s), av47 - 25000, "48b. available doesn't move — already accounted for");
  eq(cardPending(s), 0, "48c. nothing left pending");
  eq(monthSpent(s,"2026-08",null), 0, "48d. still out of monthly spending");
  // and undoing the payment puts it back
  s.transactions[0].paid = false;
  eq(curBalance(s), cur47, "48e. undoing a payment restores current");
  eq(available(s), av47 - 25000, "48f. available still unmoved");

  // several charges, paid in one go
  s = base();
  s.transactions.push(card("k1", 25000), card("k2", 40000), card("k3", 10000));
  eq(cardPending(s), 75000, "49a. pending is the sum of unpaid charges");
  eq(available(s), av47 - 75000, "49b. all of it held out of available");
  const avBeforePay = available(s);
  txns(s).filter(t=>t.type==="card").forEach(t => { t.paid = true; });
  eq(curBalance(s), cur47 - 75000, "49c. paying the bill clears it from current");
  eq(available(s), avBeforePay, "49d. available unchanged across the whole bill");
  eq(cardPending(s), 0, "49e. nothing pending afterwards");

  // deleting behaves differently depending on whether it was paid
  s = base(); s.transactions.push(card("k1", 25000));
  tombstone(s.transactions[0]);
  eq(available(s), av47, "50a. deleting an unpaid charge gives available back");
  eq(curBalance(s), cur47, "50b. current was never touched");
  s = base(); s.transactions.push(card("k1", 25000, true));
  tombstone(s.transactions[0]);
  eq(curBalance(s), cur47, "50c. deleting a paid charge gives current back");
  eq(available(s), av47, "50d. and available with it");

  // the side sections stack correctly
  s = base();
  s.laundryBudgets = [{ id:"2026-08", amount:50000, updatedAt:1 }];
  s.transactions.push(card("k1", 30000));
  s.transactions.push({id:"e1",type:"expense",categoryId:"c1",amount:5000,date:T,updatedAt:1});
  s.owed.push({id:"o1",label:"R",amount:20000,remaining:20000,dateAdded:T,status:"open",note:"",updatedAt:1});
  eq(curBalance(s), 100000 - 5000, "51a. only the real expense left current");
  eq(available(s), 100000 - 5000 - 20000 + 20000 - 50000 - 30000,
     "51b. available nets min, owed, laundry held and card pending together");

  // archive records card charges separately
  s = base(); s.meta.lastSeenMonth = "2026-07";
  s.transactions.push({id:"e7",type:"expense",categoryId:"c1",amount:4000,date:"2026-07-05",updatedAt:1});
  s.transactions.push(card("k7", 12000, false, "2026-07-11"));
  rolloverIfNeeded(s, "2026-08");
  eq(s.archive[0].spent, 4000, "52a. archived spending excludes card charges");
  eq(s.archive[0].card, 12000, "52b. card charges archived on their own line");
  eq(s.archive[0].added, 0, "52c. an unpaid charge is not money added");
  eq(s.archive[0].closingBalance, 96000, "52d. unpaid charge doesn't move the closing balance");

  // an unpaid charge must never be mistaken for income by the balance history
  s = base(); s.transactions.push(card("k1", 25000), {id:"a1",type:"add",amount:9000,date:T,updatedAt:1});
  eq(txns(s).filter(isInflow).length, 1, "53a. only the top-up counts as money in");
  eq(txns(s).filter(t => t.type === "card" && !t.paid).every(t => !isSpend(t)), true,
     "53b. an unpaid charge is neither spend nor inflow");
  eq(curBalance(s), 109000, "53c. so the balance only reflects the top-up");

  /* ---- reimbursed (same machine as essentials, own bucket) ---- */
  const reim = (id, amt, ts, date) => ({ id, type:"reimbursed", amount:amt, date:date||T,
                                         note:"", updatedAt:ts||1 });
  s = base();
  const cur54 = curBalance(s), av54 = available(s);
  s.transactions.push(reim("r1", 60000));
  eq(curBalance(s), cur54 - 60000, "54a. a reimbursement comes out of current");
  eq(monthSpent(s,"2026-08",null), 0, "54b. stays out of monthly spending");
  eq(spendPerDay(s,"2026-08",null,T), 0, "54c. and the per-day figure");
  eq(monthAdded(s,"2026-08"), 0, "54d. not counted as money coming in");
  eq(typeTotal(s,"reimbursed","2026-08"), 60000, "54e. has its own total");
  eq(typeTotal(s,"essential","2026-08"), 0, "54f. kept apart from essentials");
  // with its owed entry, available is unmoved
  s.owed.push({id:"o5",label:"Group dinner",amount:60000,remaining:60000,dateAdded:T,
               status:"open",note:"",updatedAt:1});
  eq(available(s), av54, "54g. reimbursement + its owed entry leaves available unchanged");

  // the two buckets stay independent of each other
  s = base();
  s.transactions.push(reim("r1", 60000));
  s.transactions.push({id:"x1",type:"essential",amount:30000,date:T,note:"",updatedAt:1});
  eq(typeTotal(s,"reimbursed","2026-08"), 60000, "55a. reimbursed total is its own");
  eq(typeTotal(s,"essential","2026-08"), 30000, "55b. essentials total is its own");
  eq(curBalance(s), cur54 - 90000, "55c. both leave current");
  eq(monthSpent(s,"2026-08",null), 0, "55d. neither touches monthly spending");

  // deleting one leaves the owed entry alone, exactly like essentials
  s = base();
  s.transactions.push(reim("r1", 60000));
  s.owed.push({id:"o5",label:"Group dinner",amount:60000,remaining:60000,dateAdded:T,
               status:"open",note:"",updatedAt:1});
  tombstone(s.transactions[0]);
  eq(curBalance(s), cur54, "56a. deleting restores the balance");
  eq(owedTotal(s), 60000, "56b. and leaves the owed entry standing");

  // archived on its own line
  s = base(); s.meta.lastSeenMonth = "2026-07";
  s.transactions.push({id:"e9",type:"expense",categoryId:"c1",amount:4000,date:"2026-07-05",updatedAt:1});
  s.transactions.push(reim("r9", 7000, 1, "2026-07-12"));
  rolloverIfNeeded(s, "2026-08");
  eq(s.archive[0].spent, 4000, "57a. archived spending excludes reimbursements");
  eq(s.archive[0].reimbursed, 7000, "57b. archived on its own line");
  eq(s.archive[0].closingBalance, 100000-4000-7000, "57c. closing balance nets it");

  // the metadata table drives both owed-backed sections
  eq(SIDE_META.essential.owedBacked, true, "58a. essentials creates an owed entry");
  eq(SIDE_META.reimbursed.owedBacked, true, "58b. reimbursed does too");
  eq(SIDE_META.laundry.owedBacked, false, "58c. laundry doesn't");
  eq(SIDE_META.card.owedBacked, false, "58d. nor does the card");
  eq(SPEND_TYPES.indexOf("reimbursed") >= 0, true, "58e. reimbursed counts as spending from current");

  /* ---- built-in categories added after setup ---- */
  eq(BUILTIN_CATS.indexOf("Gajalakshmi") >= 0, true, "59a. Gajalakshmi is a built-in outlet");
  eq(builtinCatId("Gajalakshmi"), "builtin-gajalakshmi", "59b. built-in ids are derived from the name");
  eq(builtinCatId("Night Canteen"), "builtin-night-canteen", "59c. spaces become dashes");

  // existing data gains the new outlet without disturbing what's there
  let old2 = { version:3, settings:{minBalance:1000,includeOwed:true,updatedAt:1},
    categories:[{id:"c1",name:"Mess",builtin:true,archived:false,updatedAt:1},
                {id:"c2",name:"Subspot",builtin:true,archived:false,updatedAt:1}],
    transactions:[{id:"t",type:"expense",categoryId:"c1",amount:500,date:T,updatedAt:1}],
    owed:[], archive:[], laundryBudgets:[], owedGroups:[],
    meta:{initialBalance:20000,savedAt:"2026-08-01T00:00:00.000Z"} };
  let mig2 = migrate(JSON.parse(JSON.stringify(old2)));
  const names = mig2.categories.map(c=>c.name);
  eq(names.indexOf("Gajalakshmi") >= 0, true, "60a. it appears in existing data on load");
  eq(mig2.categories.find(c=>c.name==="Gajalakshmi").id, "builtin-gajalakshmi", "60b. with the fixed id");
  eq(mig2.categories.find(c=>c.name==="Mess").id, "c1", "60c. existing categories keep their ids");
  eq(curBalance(mig2), 19500, "60d. balances are untouched");
  eq(names.filter(n=>n==="Gajalakshmi").length, 1, "60e. added exactly once");

  // loading twice must not add it twice
  const twice = migrate(JSON.parse(JSON.stringify(mig2)));
  eq(twice.categories.filter(c=>c.name==="Gajalakshmi").length, 1, "61a. re-loading doesn't duplicate it");
  // and archiving it must stick
  twice.categories.find(c=>c.name==="Gajalakshmi").archived = true;
  const thrice = migrate(JSON.parse(JSON.stringify(twice)));
  eq(thrice.categories.filter(c=>c.name==="Gajalakshmi").length, 1, "61b. no duplicate after archiving");
  eq(thrice.categories.find(c=>c.name==="Gajalakshmi").archived, true, "61c. archiving it sticks");
  // deleting it outright must also stick, thanks to seededCats
  const gone = migrate(JSON.parse(JSON.stringify(
    Object.assign({}, thrice, { categories: thrice.categories.filter(c=>c.name!=="Gajalakshmi") }))));
  eq(gone.categories.filter(c=>c.name==="Gajalakshmi").length, 0, "61d. removing it is respected");

  // two devices seeding it independently merge to one row
  A = dev([]); A.categories = A.categories.concat(
    [{id:"builtin-gajalakshmi",name:"Gajalakshmi",builtin:true,archived:false,updatedAt:5}]);
  B = dev([]); B.categories = B.categories.concat(
    [{id:"builtin-gajalakshmi",name:"Gajalakshmi",builtin:true,archived:false,updatedAt:9}]);
  M = mergeStates(A,B);
  eq(M.categories.filter(c=>c.name==="Gajalakshmi").length, 1,
     "62a. both devices seeding it still yields one category");

  function rec(st,o,amt,date){
    st.transactions.push({id:uid(),type:"received",owedId:o.id,amount:amt,date,note:o.label});
    syncOwed(st, o);
    if (o.status === "received") o.dateClosed = date;
  }

  const failed = out.filter(l => l[0] === "!").length;
  const head = failed ? failed + " TEST(S) FAILED" : "All " + out.length + " tests passed";
  document.getElementById("view").innerHTML =
    `<div class="card"><h3 style="margin-top:0" class="${failed ? "bad" : "good"}">${head}</h3>
     <div class="tests">${esc(out.join("\n"))}</div>
     <p style="margin-bottom:0"><a href="index.html">← Back to the app</a></p></div>`;
  console.log(head + "\n" + out.join("\n"));
}

/* ============================ BOOT ============================ */
async function boot(){
  if (new URLSearchParams(location.search).get("test") === "1"){
    document.querySelector("nav").style.display = "none";
    runTests(); return;
  }
  Sync.load();
  try { state = await Store.boot(); }
  catch(e){ console.error("Boot failed:", e); state = null; }
  if (state){
    const closed = rolloverIfNeeded(state);
    render();
    if (closed.length) Store.save(state).catch(e => console.error(e));
  } else render();

  // Catch up whenever this device comes back into use or back online.
  Sync.start();
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && Date.now() - Sync.lastAt > 8000) Sync.run();
  });
  window.addEventListener("online", () => Sync.run());
  window.addEventListener("offline", () => { Sync.status = "offline"; paintSync(); });
  setInterval(paintSync, 30000);      // keep the "synced 3m ago" label honest

  if ("serviceWorker" in navigator && location.protocol.startsWith("http"))
    navigator.serviceWorker.register("sw.js").catch(e => console.warn("No service worker:", e));
}
boot();
</script>
