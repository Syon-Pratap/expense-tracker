<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Expense Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6fed">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Expenses">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --text:#14161a; --muted:#6b7280; --line:#e4e6ea;
  --accent:#2f6fed; --good:#0a8f4d; --bad:#d92d20; --warn:#b45309; --chip:#eef1f6;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#101216; --card:#1a1d23; --text:#e8eaed; --muted:#9aa0a6; --line:#2a2e36;
         --accent:#6f9bff; --good:#3ac07e; --bad:#ff6b6b; --warn:#e0a458; --chip:#242830; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;flex-wrap:wrap}
h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.2px}
.save-ind{font-size:12px;color:var(--muted);white-space:nowrap}
.save-ind.err{color:var(--bad);font-weight:600}
nav{display:flex;gap:4px;margin-left:auto}
nav button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);
  color:var(--text);border-radius:8px;padding:7px 13px}
nav button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn:hover,nav button:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--line)}
main{max-width:900px;margin:0 auto;padding:18px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.hero{text-align:center;padding:22px 16px}
.hero .lbl{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.7px}
.hero .amt{font-size:44px;font-weight:700;letter-spacing:-1.5px;margin:4px 0;font-variant-numeric:tabular-nums}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.stat .v{font-size:21px;font-weight:650;margin-top:3px;font-variant-numeric:tabular-nums}
.stat .sub{color:var(--muted);font-size:12px;margin-top:2px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:22px 0 9px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:4px}
.chip{white-space:nowrap;cursor:pointer;border:1px solid var(--line);background:var(--chip);
  color:var(--text);border-radius:999px;padding:7px 13px;font:inherit;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.chip .t{opacity:.7;margin-left:5px;font-variant-numeric:tabular-nums}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
ul.list li:last-child{border-bottom:0}
.li-main{flex:1;min-width:0}
.li-sub{color:var(--muted);font-size:12.5px;margin-top:1px;overflow:hidden;text-overflow:ellipsis}
.li-amt{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:14px}
.fab{position:fixed;right:20px;bottom:20px;z-index:20;border-radius:999px;padding:14px 22px;
  font-size:15px;font-weight:650;box-shadow:0 6px 22px rgba(0,0,0,.22)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);
  padding:0;width:min(430px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:18px}
dialog h3{margin:0 0 14px;font-size:17px}
label{display:block;margin-bottom:11px}
label span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;
  text-transform:uppercase;letter-spacing:.5px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;font:inherit;
  padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.amount-in{font-size:24px !important;font-weight:650;font-variant-numeric:tabular-nums}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.dlg-actions .spacer{margin-right:auto}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:-4px}
.banner{border-radius:10px;padding:11px 13px;font-size:13.5px;margin-bottom:14px;
  border:1px solid var(--line);background:var(--chip);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner .grow{flex:1;min-width:180px}
.banner.bad{border-color:var(--bad);color:var(--bad)}
.banner.info{border-color:var(--accent)}
.toggle{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--muted);
  font-size:13px;margin-top:8px;cursor:pointer}
.toggle input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
details summary{cursor:pointer;color:var(--muted);font-size:13px;padding:6px 0}
.pill{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--chip);color:var(--muted)}
.tests{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;white-space:pre-wrap}
.setup{max-width:400px;margin:50px auto}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.bar{height:7px;border-radius:4px;background:var(--accent);opacity:.85;min-width:3px}
.bartrack{flex:1;background:var(--chip);border-radius:4px;overflow:hidden;max-width:220px}
.mono{font-variant-numeric:tabular-nums}
.selbox{width:20px;height:20px;accent-color:var(--accent);cursor:pointer;flex:0 0 auto;margin:0}
.grouptext{font-family:ui-monospace,Consolas,monospace;font-size:13px;white-space:pre-wrap;
  background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px;margin:10px 0 0;
  overflow-x:auto}
.grouprow{padding:14px 0;border-bottom:1px solid var(--line)}
.grouprow:last-child{border-bottom:0}
.grouprow:first-child{padding-top:2px}
@media (max-width:640px){
  header{padding:10px 12px;gap:8px}
  /* row 1: title, status, settings. row 2: the scrolling tab strip. */
  h1{font-size:15px;order:-2}
  .save-ind{order:-2;font-size:11px}
  header>[data-act=settings]{order:-1;margin-left:auto}
  nav{margin-left:0;flex:1 0 100%;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch;
      padding-bottom:2px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:0 0 auto;padding:8px 12px;font-size:13px}
  main{padding:14px 12px calc(96px + env(safe-area-inset-bottom))}
  .hero .amt{font-size:38px}
  .grid{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
  ul.list li{flex-wrap:wrap;padding:12px 2px}
  ul.list li .btn{padding:6px 11px}      /* easier to hit with a thumb */
  .li-main{flex:1 0 60%}
  .fab{right:16px;bottom:calc(16px + env(safe-area-inset-bottom));padding:15px 24px}
  dialog{width:min(430px,94vw)}
  input[type=text],input[type=number],input[type=date],select{font-size:16px}  /* stops iOS zooming on focus */
}
</style>
</head>
<body>
<header>
  <h1>Expense Tracker</h1>
  <span class="save-ind" id="saveInd"></span>
  <span class="save-ind" id="syncInd"></span>
  <nav id="tabs">
    <button data-act="tab" data-id="dash">Dashboard</button>
    <button data-act="tab" data-id="exp">Expenses</button>
    <button data-act="tab" data-id="ess">Essentials</button>
    <button data-act="tab" data-id="reim">Reimbursed</button>
    <button data-act="tab" data-id="laun">Laundry</button>
    <button data-act="tab" data-id="card">Card</button>
    <button data-act="tab" data-id="arch">Archive</button>
    <button data-act="tab" data-id="owed">Owed</button>
  </nav>
  <button class="btn" data-act="settings" title="Settings">&#9881;</button>
</header>
<main id="view"></main>
<dialog id="dlg"></dialog>

<script>
"use strict";
/* ============================================================================
   Personal expense tracker — one file, offline, no server, no account.

   STORAGE (durable across closing the app, the browser, and reboots):
     1. IndexedDB  — the working store, written on every change.
     2. localStorage — a mirror, so either one alone can rebuild your data.
     3. An optional real file on disk (expense-data.json) via the File System
        Access API, written on every change once you link it in Settings.
     Persistent-storage permission is requested so the browser never evicts it.

   MONTHS: on the 1st, the finished month is summarised into the Archive and
   the dashboard starts fresh. Raw entries are never deleted.

   Open index.html?test=1 to run the test suite.
   ========================================================================== */

const KEY = "expense-tracker-v1";              // localStorage mirror key
const DB_NAME = "expense-tracker", DB_STORE = "kv";
const BUILTIN_CATS = ["Vending Machine","Mess","Night Canteen","RC","JV Shetty",
                      "IC","Nescafe","INS","Subspot","Gajalakshmi","Other Canteens"];
/* Built-in categories added after first setup need a fixed id, so two devices
   seeding the same one produce the same row and merging dedupes it. */
function builtinCatId(name){
  return "builtin-" + name.toLowerCase().replace(/[^a-z0-9]+/g, "-");
}

/* ---------- money: integer paise everywhere ---------- */
function parseMoney(str, allowNegative){
  if (str == null) return null;
  let s = String(str).replace(/[\s,₹]/g,"");
  if (s === "") return null;
  if (!/^-?\d*\.?\d{0,2}$/.test(s)) return null;
  const n = Number(s);
  if (!isFinite(n)) return null;
  const p = Math.round(n * 100);
  if (!allowNegative && p <= 0) return null;
  if (allowNegative && p === 0) return null;
  return p;
}
/* For fields where zero is a legitimate value (minimum balance, starting balance). */
function parseAmountOrZero(str){
  const s = String(str == null ? "" : str).replace(/[\s,₹]/g,"");
  if (s === "" || s === "-" || !/^-?\d*\.?\d{0,2}$/.test(s)) return null;
  const n = Number(s);
  return isFinite(n) ? Math.round(n * 100) : null;
}
function fmt(paise){
  const neg = paise < 0, p = Math.abs(paise);
  const rupees = Math.floor(p/100), cents = p%100;
  let s = rupees.toLocaleString("en-IN");
  if (cents) s += "." + String(cents).padStart(2,"0");
  return (neg ? "-₹" : "₹") + s;
}
function toInput(paise){ return (paise/100).toFixed(2).replace(/\.00$/,""); }

/* ---------- dates: local YYYY-MM-DD strings, never UTC ---------- */
function todayStr(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0")
         + "-" + String(d.getDate()).padStart(2,"0");
}
function ymOf(dateStr){ return dateStr.slice(0,7); }
function curYm(){ return ymOf(todayStr()); }
function daysInMonth(ym){ const [y,m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); }
function lastDayOf(ym){ return ym + "-" + String(daysInMonth(ym)).padStart(2,"0"); }
function monthLabel(ym){
  const [y,m] = ym.split("-").map(Number);
  return new Date(y, m-1, 1).toLocaleString("en-IN",{month:"long",year:"numeric"});
}
function shiftMonth(ym, delta){
  const [y,m] = ym.split("-").map(Number);
  const d = new Date(y, m-1+delta, 1);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
}
function prettyDate(dateStr){
  const [y,m,d] = dateStr.split("-").map(Number);
  return new Date(y,m-1,d).toLocaleDateString("en-IN",{day:"numeric",month:"short"});
}
// Today counts as both elapsed and remaining.
function daysElapsed(ym, today){
  today = today || todayStr();
  if (ym === ymOf(today)) return Number(today.slice(8,10));
  return daysInMonth(ym);
}
function daysRemaining(ym, today){
  today = today || todayStr();
  const now = ymOf(today);
  if (ym === now) return daysInMonth(ym) - Number(today.slice(8,10)) + 1;
  if (ym < now) return 0;
  return daysInMonth(ym);
}

/* ---------- live entities ----------
   Deleting sets a `deleted` tombstone instead of removing the row, so a delete
   made on one device survives merging with a device that still has the row.
   Every read goes through these, so tombstones never reach the UI or the maths. */
function txns(s){ return s.transactions.filter(x => !x.deleted); }
function owedRows(s){ return s.owed.filter(o => !o.deleted); }
function catRows(s){ return s.categories.filter(c => !c.deleted); }

/* Edit timestamps drive "who wins" when two devices touch the same row, but
   phone and laptop clocks drift. clockFloor keeps our stamps strictly above the
   newest timestamp we've ever seen, so an edit made *after* seeing the other
   device's data always wins — even if that device's clock runs fast. */
let clockFloor = 0;
function nowTs(){ const t = Math.max(Date.now(), clockFloor + 1); clockFloor = t; return t; }
function noteClock(s){
  if (!s) return s;
  for (const list of [s.categories, s.transactions, s.owed])
    for (const r of (list || [])) if (r && r.updatedAt > clockFloor) clockFloor = r.updatedAt;
  if (s.settings && s.settings.updatedAt > clockFloor) clockFloor = s.settings.updatedAt;
  if (s.meta && s.meta.initialBalanceUpdatedAt > clockFloor) clockFloor = s.meta.initialBalanceUpdatedAt;
  return s;
}
function stamp(x){ x.updatedAt = nowTs(); return x; }
function tombstone(x){ x.deleted = true; return stamp(x); }

/* Same data must produce the same string on every device, whatever order keys
   or rows happen to sit in — otherwise the two devices see a phantom change and
   push at each other forever. */
function canonical(v){
  if (Array.isArray(v)) return v.map(canonical);
  if (v && typeof v === "object"){
    const out = {};
    for (const k of Object.keys(v).sort()) out[k] = canonical(v[k]);
    return out;
  }
  return v;
}
function sortById(rows){
  return (rows || []).slice().sort((x,y)=> x.id < y.id ? -1 : x.id > y.id ? 1 : 0);
}
function normalizeState(s){
  if (!s) return s;
  s.categories = sortById(s.categories);
  s.transactions = sortById(s.transactions);
  s.owed = sortById(s.owed);
  s.laundryBudgets = sortById(s.laundryBudgets);
  s.owedGroups = sortById(s.owedGroups);
  s.archive = (s.archive || []).slice().sort((a,b)=> a.ym < b.ym ? 1 : -1);
  return s;
}

/* ---------- pure model ----------
   Three kinds of spending, all of which leave your pocket, but only plain
   "expense" counts towards the day-to-day spending figures:
     expense   — canteen etc. Counted everywhere.
     essential — money you expect back; creates an owed entry alongside it.
     laundry   — drawn against an amount set aside for the month.            */
const SPEND_TYPES = ["expense", "essential", "reimbursed", "laundry"];
const INFLOW_TYPES = ["add", "received", "adjust"];
/* The sections that sit beside plain expenses. The `owedBacked` ones create a
   matching owed entry when added, which is what leaves available unmoved. */
const SIDE_META = {
  essential:  { noun:"essential",     plural:"Essentials", owedBacked:true,
                hint:"e.g. medicines",            owedLabel:"Essentials",
                blurb:"Things you buy that you expect to get back." },
  reimbursed: { noun:"reimbursement", plural:"Reimbursed", owedBacked:true,
                hint:"e.g. dinner for the group", owedLabel:"Reimbursement",
                blurb:"Money you fronted for someone else." },
  laundry:    { noun:"laundry spend", plural:"Laundry",    owedBacked:false, hint:"e.g. washing" },
  card:       { noun:"card charge",   plural:"Card",       owedBacked:false, hint:"e.g. headphones" }
};
/* A card charge only leaves your balance once the bill is paid. Until then it's
   committed money that hasn't moved, so it counts against available and nothing
   else — see cardPending(). */
function isSpend(x){
  if (x.type === "card") return !!x.paid;
  return SPEND_TYPES.indexOf(x.type) >= 0;
}
function isInflow(x){ return INFLOW_TYPES.indexOf(x.type) >= 0; }
function txnDelta(x){ return isSpend(x) ? -x.amount : isInflow(x) ? x.amount : 0; }

function curBalance(s){
  let t = s.meta.initialBalance;
  for (const x of txns(s)) t += txnDelta(x);
  return t;
}
function balanceAsOf(s, dateStr){
  let t = s.meta.initialBalance;
  for (const x of txns(s)){
    if (x.date > dateStr) continue;
    t += txnDelta(x);
  }
  return t;
}
/* Charges you've made but not yet settled: money spoken for, still in your account. */
function cardPending(s){
  return txns(s).reduce((a,x)=> (x.type === "card" && !x.paid) ? a + x.amount : a, 0);
}
function typeTotal(s, type, ym){
  return txns(s).reduce((a,x)=>
    (x.type === type && (!ym || ymOf(x.date) === ym)) ? a + x.amount : a, 0);
}
/* The laundry amount carries forward: a month with nothing set uses the most
   recent earlier month's figure. */
function laundryBudget(s, ym){
  const rows = (s.laundryBudgets || [])
    .filter(r => !r.deleted && r.id <= ym)
    .sort((a,b)=> a.id < b.id ? -1 : 1);
  return rows.length ? rows[rows.length-1].amount : 0;
}
/* What's still held back out of available: whatever you set aside and haven't
   spent yet. Spending it moves money out of current and out of the reserve at
   the same time, which is why available doesn't budge. */
function laundryHeld(s, ym){
  ym = ym || curYm();
  return Math.max(0, laundryBudget(s, ym) - typeTotal(s, "laundry", ym));
}
function owedTotal(s){
  return owedRows(s).reduce((t,o)=> o.status === "open" ? t + o.remaining : t, 0);
}
function receivedFor(s, owedId){
  return txns(s).reduce((a,t)=> (t.type === "received" && t.owedId === owedId) ? a + t.amount : a, 0);
}
/* An owed entry's outstanding amount is always derived from its payments, so
   editing or undoing any payment can never leave it out of step. */
function syncOwed(s, o){
  if (o.status === "writtenOff"){ o.remaining = 0; return o; }
  const got = receivedFor(s, o.id);
  o.remaining = Math.max(0, o.amount - got);
  if (o.remaining === 0 && got > 0){
    o.status = "received";
    if (!o.dateClosed) o.dateClosed = todayStr();
  } else {
    o.status = "open"; o.dateClosed = null;
  }
  return o;
}
function available(s){
  return curBalance(s) - s.settings.minBalance
         + (s.settings.includeOwed ? owedTotal(s) : 0)
         - laundryHeld(s)
         - cardPending(s);
}
function avgPerDay(s, today){
  const left = daysRemaining(curYm(), today);
  const av = available(s);
  return left > 0 ? Math.floor(av / left) : av;
}
function monthSpent(s, ym, catId){
  return txns(s).reduce((t,x)=>{
    if (x.type !== "expense" || ymOf(x.date) !== ym) return t;
    if (catId && catId !== "all" && x.categoryId !== catId) return t;
    return t + x.amount;
  }, 0);
}
function spendPerDay(s, ym, catId, today){
  const d = daysElapsed(ym, today);
  return d > 0 ? Math.floor(monthSpent(s, ym, catId) / d) : 0;
}
function monthAdded(s, ym){
  return txns(s).reduce((t,x)=>
    (isInflow(x) && ymOf(x.date) === ym) ? t + x.amount : t, 0);
}

/* ---------- monthly archive ---------- */
function buildArchive(s, ym){
  const ents = txns(s).filter(t => t.type === "expense" && ymOf(t.date) === ym);
  const by = {};
  for (const t of ents) by[t.categoryId] = (by[t.categoryId] || 0) + t.amount;
  const spent = ents.reduce((a,t)=> a + t.amount, 0);
  const days = daysInMonth(ym);
  return {
    ym, entries: ents.length, spent, days,
    perDay: Math.floor(spent / days),
    added: monthAdded(s, ym),
    essentials: typeTotal(s, "essential", ym),
    reimbursed: typeTotal(s, "reimbursed", ym),
    laundry: typeTotal(s, "laundry", ym),
    card: typeTotal(s, "card", ym),
    closingBalance: balanceAsOf(s, lastDayOf(ym)),
    minBalance: s.settings.minBalance,
    byCategory: Object.keys(by).map(id => {
      const c = s.categories.find(c => c.id === id);
      return { id, name: c ? c.name : "(removed)", total: by[id] };
    }).sort((a,b)=> b.total - a.total),
    closedAt: todayStr()
  };
}
/* Archive records are summaries of live entries, so they must be rebuilt whenever
   an entry in an already-closed month is edited or deleted. */
function refreshArchive(s){
  s.archive = s.archive.map(r => {
    const fresh = buildArchive(s, r.ym);
    fresh.closedAt = r.closedAt;          // keep when it was actually closed
    return fresh;
  }).sort((a,b)=> a.ym < b.ym ? 1 : -1);
  return s.archive;
}
/* Runs on boot and after every change. Summarises each finished month that has
   entries and isn't archived yet. Never deletes the underlying entries. */
function rolloverIfNeeded(s, nowYm){
  nowYm = nowYm || curYm();
  if (!s.meta.lastSeenMonth) s.meta.lastSeenMonth = nowYm;
  if (s.meta.lastSeenMonth >= nowYm) return [];
  const closed = [];
  let m = s.meta.lastSeenMonth;
  while (m < nowYm){
    if (!s.archive.some(a => a.ym === m)){
      const rec = buildArchive(s, m);
      if (rec.entries > 0 || rec.added !== 0){ s.archive.push(rec); closed.push(m); }
    }
    m = shiftMonth(m, 1);
  }
  s.archive.sort((a,b)=> a.ym < b.ym ? 1 : -1);
  s.meta.lastSeenMonth = nowYm;
  if (closed.length) s.meta.pendingBackup = closed[closed.length-1];
  return closed;
}

/* ============================ MERGE ============================
   Two devices editing the same data can't be resolved by "newest file wins" —
   that throws away whatever the other device did. Instead every row carries an
   id and an updatedAt, so merging is a union: keep every row either side knows
   about, and for rows both sides have, keep the one edited most recently.
   Deletes are tombstones, so they merge like any other edit.                */
function pickNewer(x, y){
  const tx = x.updatedAt || 0, ty = y.updatedAt || 0;
  if (tx !== ty) return tx > ty ? x : y;
  // Same timestamp (or both legacy rows): break the tie the same way on every
  // device, so two devices never settle on different answers.
  const sx = JSON.stringify(x), sy = JSON.stringify(y);
  return sx >= sy ? x : y;
}
function mergeRows(a, b){
  const m = new Map();
  for (const x of a || []) m.set(x.id, x);
  for (const y of b || []){
    const prev = m.get(y.id);
    m.set(y.id, prev ? pickNewer(prev, y) : y);
  }
  // Sort by id so the merged file is identical whichever device produced it.
  return sortById([...m.values()]);
}
/* Merges remote into local and returns a fresh state. Never mutates either. */
function mergeStates(local, remote){
  if (!remote) return noteClock(normalizeState(local));
  if (!local) return noteClock(normalizeState(remote));
  const lt = local.settings.updatedAt || 0, rt = remote.settings.updatedAt || 0;
  const lm = local.meta.initialBalanceUpdatedAt || 0, rm = remote.meta.initialBalanceUpdatedAt || 0;
  const out = {
    version: 3,
    settings: rt > lt ? remote.settings : local.settings,
    categories: mergeRows(local.categories, remote.categories),
    transactions: mergeRows(local.transactions, remote.transactions),
    owed: mergeRows(local.owed, remote.owed),
    // keyed by month, so the row id is the month itself and merging is free
    laundryBudgets: mergeRows(local.laundryBudgets, remote.laundryBudgets),
    owedGroups: mergeRows(local.owedGroups, remote.owedGroups),
    archive: [],
    meta: Object.assign({}, local.meta, {
      initialBalance: rm > lm ? remote.meta.initialBalance : local.meta.initialBalance,
      initialBalanceUpdatedAt: Math.max(lm, rm),
      createdAt: [local.meta.createdAt, remote.meta.createdAt].filter(Boolean).sort()[0] || todayStr(),
      lastSeenMonth: (remote.meta.lastSeenMonth || "") > (local.meta.lastSeenMonth || "")
                     ? remote.meta.lastSeenMonth : local.meta.lastSeenMonth,
      savedAt: (remote.meta.savedAt || "") > (local.meta.savedAt || "") ? remote.meta.savedAt : local.meta.savedAt
    })
  };
  // Archived months are the union of both sides; the figures are recomputed
  // from the merged entries, so a stale summary can never survive a merge.
  const months = new Set([...(local.archive||[]).map(r=>r.ym), ...(remote.archive||[]).map(r=>r.ym)]);
  out.archive = [...months].map(ym => {
    const l = (local.archive||[]).find(r=>r.ym===ym), r = (remote.archive||[]).find(r=>r.ym===ym);
    const rec = buildArchive(out, ym);
    rec.closedAt = [l && l.closedAt, r && r.closedAt].filter(Boolean).sort()[0] || todayStr();
    return rec;
  }).sort((a,b)=> a.ym < b.ym ? 1 : -1);
  // Outstanding amounts are derived, so re-derive them against merged payments.
  out.owed.forEach(o => { if (!o.deleted) syncOwed(out, o); });
  return noteClock(normalizeState(out));
}

/* ============================ STORAGE ============================ */
function idb(){
  return new Promise((res, rej)=>{
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains(DB_STORE)) r.result.createObjectStore(DB_STORE); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function idbDo(mode, fn){
  return idb().then(db => new Promise((res, rej)=>{
    const tx = db.transaction(DB_STORE, mode);
    const req = fn(tx.objectStore(DB_STORE));
    tx.oncomplete = () => res(req && req.result);
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error);
  }));
}
const idbGet = k => idbDo("readonly",  st => st.get(k));
const idbSet = (k,v) => idbDo("readwrite", st => st.put(v, k));
const idbDel = k => idbDo("readwrite", st => st.delete(k));

const Store = {
  handle: null,          // FileSystemFileHandle, if a data file is linked
  fileOk: false,         // permission currently granted
  needsReconnect: false, // handle exists but permission must be re-granted
  persisted: false,      // navigator.storage.persist() granted
  status: "",            // "", "saving", "saved", "error"
  error: "",

  async readFile(){
    try {
      const f = await this.handle.getFile();
      const txt = await f.text();
      return txt.trim() ? JSON.parse(txt) : null;
    } catch(e){ console.warn("Could not read data file:", e); return null; }
  },
  async writeFile(json){
    const w = await this.handle.createWritable();
    await w.write(json);
    await w.close();
  },

  /* Pick the newest of: IndexedDB, localStorage mirror, linked file. */
  async boot(){
    let best = null, from = "nothing";
    const consider = (d, label) => {
      if (!d || typeof d !== "object") return;
      const t = (d.meta && d.meta.savedAt) || "";
      if (!best || t > ((best.meta && best.meta.savedAt) || "")){ best = d; from = label; }
    };
    try { consider(await idbGet("state"), "IndexedDB"); } catch(e){ console.warn("IndexedDB unavailable:", e); }
    try { const raw = localStorage.getItem(KEY); if (raw) consider(JSON.parse(raw), "browser storage"); }
    catch(e){ console.warn("localStorage unavailable:", e); }

    try {
      const h = await idbGet("handle");
      if (h){
        this.handle = h;
        const p = await h.queryPermission({ mode:"readwrite" });
        if (p === "granted"){ this.fileOk = true; consider(await this.readFile(), "data file"); }
        else this.needsReconnect = true;
      }
    } catch(e){ console.warn("No linked data file:", e); }

    try { if (navigator.storage && navigator.storage.persist) this.persisted = await navigator.storage.persist(); }
    catch(e){ /* not fatal */ }

    this.loadedFrom = from;
    return best ? migrate(best) : null;
  },

  /* Saves are queued so two quick actions can never interleave their writes
     and leave one store holding an older snapshot than another. */
  _chain: Promise.resolve(),
  save(s){
    this._chain = this._chain.then(() => this._write(s), () => this._write(s));
    return this._chain;
  },
  async _write(s){
    s.meta.savedAt = new Date().toISOString();
    const json = JSON.stringify(s);
    this.status = "saving"; paintSave();
    let anyOk = false;
    // localStorage first: it's synchronous, so even a hard close right here
    // leaves the newest data on disk.
    try { localStorage.setItem(KEY, json); anyOk = true; } catch(e){ console.warn("localStorage write failed:", e); }
    try { await idbSet("state", JSON.parse(json)); anyOk = true; } catch(e){ console.warn("IndexedDB write failed:", e); }
    if (this.handle && this.fileOk){
      try { await this.writeFile(json); anyOk = true; }
      catch(e){ this.fileOk = false; this.needsReconnect = true; console.warn("File write failed:", e); render(); }
    }
    this.status = anyOk ? "saved" : "error";
    this.error = anyOk ? "" : "Could not save. Export a backup now.";
    paintSave();
    return anyOk;
  }
};

function paintSave(){
  const el = document.getElementById("saveInd");
  if (!el) return;
  const f = Store.handle && Store.fileOk ? " · file linked" : "";
  el.className = "save-ind" + (Store.status === "error" ? " err" : "");
  el.textContent = Store.status === "saving" ? "Saving…"
                 : Store.status === "error"  ? "⚠ " + Store.error
                 : Store.status === "saved"  ? "Saved" + f : f.replace(/^ · /,"");
}

function migrate(d){
  if (!d || typeof d !== "object") return null;
  if (!d.version) d.version = 1;
  d.settings   = Object.assign({ minBalance:0, includeOwed:true }, d.settings);
  d.meta       = Object.assign({ initialBalance:0, createdAt:todayStr(), savedAt:"" }, d.meta);
  d.categories = d.categories || [];
  d.transactions = d.transactions || [];
  d.owed       = d.owed || [];
  d.archive    = d.archive || [];                       // added in v2
  d.laundryBudgets = d.laundryBudgets || [];            // added in v4
  d.owedGroups = d.owedGroups || [];                    // added in v5
  // v3: every row needs an id and an updatedAt so it can be merged across devices.
  const seed = Date.parse(d.meta.savedAt || "") || 1;
  [d.categories, d.transactions, d.owed, d.laundryBudgets, d.owedGroups].forEach(list => list.forEach(x => {
    if (!x.id) x.id = uid();
    if (typeof x.updatedAt !== "number") x.updatedAt = seed;
  }));
  if (typeof d.settings.updatedAt !== "number") d.settings.updatedAt = seed;
  if (typeof d.meta.initialBalanceUpdatedAt !== "number") d.meta.initialBalanceUpdatedAt = seed;
  /* Built-in categories introduced after you first set up get added on load.
     seededCats remembers which ones have been offered, so one you archive or
     rename is never silently put back. */
  d.meta.seededCats = d.meta.seededCats || [];
  for (const name of BUILTIN_CATS){
    const key = name.toLowerCase(), id = builtinCatId(name);
    const alreadyOffered = d.meta.seededCats.indexOf(key) >= 0
      || d.categories.some(c => c.id === id || (c.name || "").toLowerCase() === key);
    if (!alreadyOffered)
      d.categories.push({ id, name, builtin:true, archived:false, updatedAt: seed });
    if (d.meta.seededCats.indexOf(key) < 0) d.meta.seededCats.push(key);
  }
  // Self-heal owed entries against their payment history.
  d.owed.forEach(o => { if (o.remaining == null) o.remaining = o.amount; if (!o.deleted) syncOwed(d, o); });
  if (!d.meta.lastSeenMonth) d.meta.lastSeenMonth = curYm();
  delete d.meta.lastBackupMonth;                        // replaced by rollover
  d.version = 3;
  return noteClock(d);
}
function freshState(initial, min){
  const now = nowTs();
  return {
    version: 3,
    settings: { minBalance: min, includeOwed: true, updatedAt: now },
    categories: BUILTIN_CATS.map(n => ({ id: uid(), name: n, builtin: true, archived: false, updatedAt: now })),
    transactions: [], owed: [], archive: [], laundryBudgets: [], owedGroups: [],
    meta: { initialBalance: initial, initialBalanceUpdatedAt: now,
            createdAt: todayStr(), lastSeenMonth: curYm(), savedAt: "" }
  };
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

let state = null;
let ui = { tab:"dash", month: curYm(), cat:"all" };

function commit(){
  rolloverIfNeeded(state);
  refreshArchive(state);
  render();
  Store.save(state).catch(e => console.error(e));
  queueSync();
}

/* ---------- file linking ---------- */
async function linkNewFile(){
  if (!window.showSaveFilePicker) return alert("This browser can't link a data file. Use Chrome or Edge — your data is still saved in the browser either way.");
  try {
    const h = await window.showSaveFilePicker({
      suggestedName: "expense-data.json",
      types: [{ description:"Expense tracker data", accept:{ "application/json":[".json"] } }]
    });
    Store.handle = h; Store.fileOk = true; Store.needsReconnect = false;
    await idbSet("handle", h);
    await Store.save(state);
    closeDlg(); render();
    alert("Linked. Every change now writes straight to that file as well.");
  } catch(e){
    if (e.name === "AbortError") return;
    alert("Could not link a file: " + e.message + "\n\nYour data is still saved in this browser.");
  }
}
async function openExistingFile(){
  if (!window.showOpenFilePicker) return alert("This browser can't open a data file directly. Use Settings → Import instead.");
  try {
    const [h] = await window.showOpenFilePicker({
      types: [{ description:"Expense tracker data", accept:{ "application/json":[".json"] } }]
    });
    Store.handle = h; Store.fileOk = true; Store.needsReconnect = false;
    const d = migrate(await Store.readFile());
    if (d && Array.isArray(d.transactions)){
      if (!state || confirm("Load the data from that file? Your current data is replaced (a backup downloads first).")){
        if (state) exportNow("before-open-" + todayStr());
        state = d;
      }
    }
    await idbSet("handle", h);
    await Store.save(state);
    closeDlg(); render();
  } catch(e){
    if (e.name === "AbortError") return;
    alert("Could not open that file: " + e.message);
  }
}
async function reconnectFile(){
  try {
    const p = await Store.handle.requestPermission({ mode:"readwrite" });
    if (p === "granted"){
      Store.fileOk = true; Store.needsReconnect = false;
      const d = migrate(await Store.readFile());
      if (d && d.meta && d.meta.savedAt > (state.meta.savedAt || "")){
        if (confirm("That file is newer than what's in this browser. Load it?")) state = d;
      }
      await Store.save(state); render();
    }
  } catch(e){ alert("Could not reconnect: " + e.message); }
}
async function unlinkFile(){
  Store.handle = null; Store.fileOk = false; Store.needsReconnect = false;
  await idbDel("handle"); closeDlg(); render();
}

/* ---------- backups ---------- */
function download(name, text){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type:"application/json"}));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(a.href), 2000);
}
function exportNow(tag){ download("expense-backup-" + (tag || todayStr()) + ".json", JSON.stringify(state, null, 2)); }
function exportMonth(ym){
  const rec = state.archive.find(a => a.ym === ym) || buildArchive(state, ym);
  const entries = txns(state).filter(t => ymOf(t.date) === ym);
  download("expenses-" + ym + ".json", JSON.stringify({ month:ym, summary:rec, entries }, null, 2));
}

/* ---------- helpers ---------- */
function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function catName(id){ const c = state.categories.find(c => c.id === id); return c ? c.name : "(removed category)"; }
/* Built-ins in their listed order, then your own, so an outlet added in a later
   version doesn't land after the "Other Canteens" catch-all. */
function activeCats(){
  return catRows(state).filter(c => !c.archived).sort((a,b)=>{
    const ia = BUILTIN_CATS.indexOf(a.name), ib = BUILTIN_CATS.indexOf(b.name);
    if (ia >= 0 && ib >= 0) return ia - ib;
    if (ia >= 0) return -1;
    if (ib >= 0) return 1;
    return 0;
  });
}
function sortedExpenses(list){
  return list.slice().sort((a,b)=> a.date === b.date ? (b.id > a.id ? 1 : -1) : (a.date < b.date ? 1 : -1));
}

            : ui.tab === "reim" ? { act:"addReimbursed", label:"+ Add reimbursement" }
            : ui.tab === "laun" ? { act:"addLaundry",    label:"+ Add laundry spend" }
            : ui.tab === "card" ? { act:"addCard",       label:"+ Add card charge" }
            : (ui.tab === "dash" || ui.tab === "exp") ? { act:"addExpense", label:"+ Add expense" }

}

/* Shared list renderer for the two side sections. */
function sideList(type, ym){
  const rows = sortedExpenses(txns(state).filter(t => t.type === type && ymOf(t.date) === ym));
  if (!rows.length) return `<div class="empty">Nothing here for ${esc(monthLabel(ym))}.</div>`;
  const fallback = SIDE_META[type] ? SIDE_META[type].noun : type;
  return `<ul class="list">${rows.map(t => `<li>
      <div class="li-main">
        <div>${esc(t.note || fallback)}</div>
        <div class="li-sub">${esc(prettyDate(t.date))}</div>
      </div>
      <div class="li-amt">${esc(fmt(t.amount))}</div>
      <button class="btn sm" data-act="editSide" data-id="${esc(t.id)}">Edit</button>
    </li>`).join("")}</ul>`;
}
function monthNav(ym){
  return `<div class="row between" style="margin-bottom:12px"><div class="row">
      <button class="btn sm" data-act="prevMonth">&lsaquo;</button>
      <strong>${esc(monthLabel(ym))}</strong>
      <button class="btn sm" data-act="nextMonth">&rsaquo;</button>
      ${ym === curYm() ? `<span class="pill">this month</span>`
                       : `<button class="btn sm" data-act="thisMonth">Today</button>`}

}

/* Essentials and Reimbursed are the same machine with different labels: money

function viewLaundry(){
  const ym = ui.month;
  const budget = laundryBudget(state, ym);
  const spent = typeTotal(state, "laundry", ym);
  const left = budget - spent;
  const held = Math.max(0, left);
  const isCur = ym === curYm();
  const explicit = (state.laundryBudgets || []).some(r => !r.deleted && r.id === ym);
  return `
  ${storageBanners()}
  ${monthNav(ym)}
  <div class="card hero">
    <div class="lbl">Set aside for ${esc(monthLabel(ym))}</div>
    <div class="amt">${esc(fmt(budget))}</div>
    <div style="color:var(--muted);font-size:13px">
      ${budget ? "Held back from available; still sitting in your current balance."
               : "Nothing set aside yet."}
      ${!explicit && budget ? "<br>Carried forward from an earlier month." : ""}</div>
    <div style="margin-top:10px"><button class="btn sm primary" data-act="setLaundry">
      ${budget ? "Change amount" : "Set an amount"}</button></div>
  </div>
  <div class="grid">
    <div class="stat"><div class="k">Spent</div><div class="v">${esc(fmt(spent))}</div></div>
    <div class="stat"><div class="k">${left < 0 ? "Over by" : "Left"}</div>
      <div class="v ${left < 0 ? "bad" : ""}">${esc(fmt(Math.abs(left)))}</div>
      <div class="sub">${left < 0 ? "the excess comes out of available" : "still held back"}</div></div>
    ${isCur ? `<div class="stat"><div class="k">Held from available</div>
      <div class="v">${esc(fmt(held))}</div></div>` : ""}

}

function viewCard(){

      ${isPaid ? `<button class="btn sm" data-act="unpayCard" data-id="${esc(t.id)}">Undo paid</button>`

/* The pasteable form of a saved list: one line per item, total last. */
function groupText(g){
  return g.items.map(i => i.label + " -> " + fmt(i.amount)).join("\n")
       + "\nTotal -> " + fmt(g.total);
}
function groupRows(s){ return (s.owedGroups || []).filter(g => !g.deleted); }

function viewOwed(){
  const open   = owedRows(state).filter(o => o.status === "open");
  const closed = owedRows(state).filter(o => o.status !== "open")
                   .sort((a,b)=> (b.dateClosed || "") < (a.dateClosed || "") ? -1 : 1);
  const sel = ui.sel || [];
  const selTotal = open.filter(o => sel.indexOf(o.id) >= 0).reduce((a,o)=> a + o.remaining, 0);
  const groups = groupRows(state);
  const liveGroups = groups.filter(g => g.status !== "collected")
                       .sort((a,b)=> a.createdAt < b.createdAt ? 1 : -1);
  const doneGroups = groups.filter(g => g.status === "collected")
                       .sort((a,b)=> (a.collectedAt||"") < (b.collectedAt||"") ? 1 : -1);
  // which open entries are already spoken for by a saved list
  const inList = {};
  for (const g of liveGroups) for (const i of g.items) inList[i.owedId] = g.name;

  const groupCard = (g, done) => `<div class="grouprow">
      <div class="row between">
        <div><strong>${esc(g.name)}</strong>
          <span class="pill">${g.items.length} item${g.items.length === 1 ? "" : "s"} · ${esc(fmt(g.total))}</span>
          ${done ? `<span class="pill">collected ${esc(prettyDate(g.collectedAt || g.createdAt))}</span>` : ""}</div>
      </div>
      <pre class="grouptext">${esc(groupText(g))}</pre>
      <div class="row" style="margin-top:10px">
        <button class="btn sm" data-act="copyGroup" data-id="${esc(g.id)}">Copy text</button>
        ${done ? "" : `<button class="btn sm primary" data-act="collectGroup" data-id="${esc(g.id)}">Received all</button>`}
        <button class="btn sm danger" data-act="delGroup" data-id="${esc(g.id)}">Remove list</button>
      </div>
    </div>`;

  return `
  ${storageBanners()}
  <div class="card hero">
    <div class="lbl">Owed to me</div>
    <div class="amt">${esc(fmt(owedTotal(state)))}</div>
    <div style="color:var(--muted);font-size:13px">
      ${state.settings.includeOwed ? "Counted in your available balance" : "Not counted in available (toggle is off)"}
    </div>
  </div>

  ${sel.length ? `<div class="banner info">
    <span class="grow"><strong>${sel.length} selected</strong> · ${esc(fmt(selTotal))}</span>
    <button class="btn sm primary" data-act="makeGroup">Done</button>
    <button class="btn sm" data-act="clearSel">Clear</button>
  </div>` : ""}

  <div class="row between"><h2 style="margin:0">Open</h2>
    <button class="btn primary sm" data-act="addOwed">+ Add owed</button></div>
  <div class="card">
    ${open.length ? `<ul class="list">${open.map(o => `<li>
        <input type="checkbox" class="selbox" data-act="selOwed" data-id="${esc(o.id)}"
          ${sel.indexOf(o.id) >= 0 ? "checked" : ""} aria-label="Select ${esc(o.label)}">
        <div class="li-main">
          <div>${esc(o.label)}${o.remaining !== o.amount ? ` <span class="pill">part paid of ${esc(fmt(o.amount))}</span>` : ""}${inList[o.id] ? ` <span class="pill">in “${esc(inList[o.id])}”</span>` : ""}</div>
          <div class="li-sub">${esc(prettyDate(o.dateAdded))}${o.note ? " · " + esc(o.note) : ""}</div>
        </div>
        <div class="li-amt">${esc(fmt(o.remaining))}</div>
        <button class="btn sm primary" data-act="receiveFull" data-id="${esc(o.id)}">Received</button>
        <button class="btn sm" data-act="receivePart" data-id="${esc(o.id)}">Part</button>
        <button class="btn sm" data-act="editOwed" data-id="${esc(o.id)}">Edit</button>
        <button class="btn sm danger" data-act="writeOff" data-id="${esc(o.id)}">Write off</button>
      </li>`).join("")}</ul>
      ${!sel.length ? `<div style="color:var(--muted);font-size:12.5px;margin-top:10px">
        Tick a few to bundle them into one list you can send and collect together.</div>` : ""}`
      : `<div class="empty">Nobody owes you anything right now.</div>`}
  </div>

  ${liveGroups.length ? `<h2>Saved lists</h2>
  <div class="card">${liveGroups.map(g => groupCard(g, false)).join("")}</div>` : ""}

  <details ${doneGroups.length ? "" : "hidden"}>
    <summary>Collected lists (${doneGroups.length})</summary>
    <div class="card">${doneGroups.map(g => groupCard(g, true)).join("")}</div>
  </details>

  <details ${closed.length ? "" : "hidden"}>
    <summary>History (${closed.length})</summary>
    <div class="card"><ul class="list">${closed.map(o => `<li>
        <div class="li-main"><div>${esc(o.label)}</div>
          <div class="li-sub">${o.status === "received" ? "Received" : "Written off"} ${esc(prettyDate(o.dateClosed || o.dateAdded))}</div></div>
        <div class="li-amt" style="color:var(--muted)">${esc(fmt(o.amount))}</div>
        <button class="btn sm" data-act="reopenOwed" data-id="${esc(o.id)}">Reopen</button>
        <button class="btn sm" data-act="editOwed" data-id="${esc(o.id)}">Edit</button>
        <button class="btn sm danger" data-act="delOwed" data-id="${esc(o.id)}">Delete</button>
      </li>`).join("")}</ul></div>
  </details>`;
}

/* ============================ DIALOGS ============================ */
const dlg = document.getElementById("dlg");
function closeDlg(){ if (dlg.open) dlg.close(); dlg.innerHTML = ""; }
function openDlg(title, bodyHtml, onSubmit, extraBtnsHtml){
  dlg.innerHTML = `<form method="dialog"><h3>${esc(title)}</h3>${bodyHtml}
    <div class="err" id="d-err"></div>
    <div class="dlg-actions">${extraBtnsHtml || ""}
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn primary">Save</button></div></form>`;
  dlg.querySelector("[data-close]").onclick = closeDlg;
  dlg.querySelector("form").onsubmit = e => {
    e.preventDefault();
    const err = onSubmit(new FormData(e.target), dlg);
    if (err) dlg.querySelector("#d-err").textContent = err;
    else { closeDlg(); commit(); }
  };
  dlg.showModal();
  const first = dlg.querySelector("input:not([type=hidden]),select,textarea");
  if (first){ first.focus(); if (first.select) first.select(); }
}
const fAmount = v => `<label><span>Amount (₹)</span>
  <input class="amount-in" name="amount" type="text" inputmode="decimal" autocomplete="off"
   placeholder="0" value="${esc(v == null ? "" : toInput(v))}"></label>`;
const fDate = v => `<label><span>Date</span><input name="date" type="date" value="${esc(v || todayStr())}"></label>`;
const fNote = v => `<label><span>Note (optional)</span>
  <input name="note" type="text" autocomplete="off" value="${esc(v || "")}"></label>`;
const fCat = sel => `<label><span>Category</span><select name="cat">${
  activeCats().map(c => `<option value="${esc(c.id)}" ${c.id === sel ? "selected" : ""}>${esc(c.name)}</option>`).join("")
}</select></label>`;

function dlgExpense(existing){
  const cats = activeCats();
  if (!cats.length){ alert("Add a category first (Settings → Categories)."); return; }
  const preset = existing ? existing.categoryId : (ui.cat !== "all" ? ui.cat : cats[0].id);
  openDlg(existing ? "Edit expense" : "Add expense",
    fAmount(existing && existing.amount) + fCat(preset)
      + fDate(existing && existing.date) + fNote(existing && existing.note),
    fd => {
      const amt = parseMoney(fd.get("amount"));
      if (amt == null) return "Enter an amount greater than zero.";
      const date = fd.get("date"); if (!date) return "Pick a date.";
      if (existing) stamp(Object.assign(existing, { amount:amt, categoryId:fd.get("cat"), date, note:fd.get("note").trim() }));
      else state.transactions.push(stamp({ id:uid(), type:"expense", categoryId:fd.get("cat"),
                                     amount:amt, date, note:fd.get("note").trim() }));
      if (!existing && ymOf(date) !== ui.month) ui.month = ymOf(date);
    },
    existing ? `<button type="button" class="btn danger spacer" data-del>Delete</button>` : "");
  if (existing) dlg.querySelector("[data-del]").onclick = () => {
    if (!confirm("Delete this expense? Your balance goes back up by " + fmt(existing.amount) + ".")) return;
    tombstone(existing);
    closeDlg(); commit();
  };
}

function dlgSimpleTxn(type){
  const isAdj = type === "adjust";
  openDlg(isAdj ? "Adjust balance" : "Add money",
    (isAdj ? `<p style="color:var(--muted);font-size:13px;margin-top:0">
        Correct your balance when it drifts from reality. Negative is allowed (e.g. -150).</p>` : "")
    + fAmount(null) + fDate(null) + fNote(null),
    fd => {
      const amt = parseMoney(fd.get("amount"), isAdj);
      if (amt == null) return isAdj ? "Enter a non-zero amount (negative is fine)."
                                    : "Enter an amount greater than zero.";
      const date = fd.get("date"); if (!date) return "Pick a date.";
      state.transactions.push(stamp({ id:uid(), type, amount:amt, date, note:fd.get("note").trim() }));
    });
}

/* Edit any non-expense entry: money added, a balance adjustment, or a payment
   received against an owed entry (which can also be undone here). */
function dlgTxn(t){
  if (!t) return;
  const isAdj = t.type === "adjust", isRec = t.type === "received";
  const o = isRec ? owedRows(state).find(x => x.id === t.owedId) : null;
  const otherGot = isRec ? receivedFor(state, t.owedId) - t.amount : 0;
  const title = t.type === "add" ? "Edit money added"
              : isAdj ? "Edit adjustment" : "Edit payment received";
  const intro = !isRec ? ""
    : o ? `<p style="color:var(--muted);font-size:13px;margin-top:0">Against “${esc(o.label)}” —
            ${esc(fmt(o.amount))} owed in total${otherGot ? ", " + esc(fmt(otherGot)) + " received in other payments" : ""}.</p>`
        : `<p style="color:var(--muted);font-size:13px;margin-top:0">The owed entry this came from was deleted.</p>`;

  openDlg(title, intro + fAmount(t.amount) + fDate(t.date) + fNote(t.note),
    fd => {
      const amt = parseMoney(fd.get("amount"), isAdj);
      if (amt == null) return isAdj ? "Enter a non-zero amount (negative is fine)."
                                    : "Enter an amount greater than zero.";
      if (isRec && o && amt + otherGot > o.amount)
        return "That's more than the " + fmt(o.amount - otherGot) + " still outstanding on this.";
      const date = fd.get("date"); if (!date) return "Pick a date.";
      t.amount = amt; t.date = date; t.note = fd.get("note").trim(); stamp(t);
      if (o) stamp(syncOwed(state, o));
    },
    `<button type="button" class="btn danger spacer" data-del>${isRec ? "Undo payment" : "Delete"}</button>`);

  dlg.querySelector("[data-del]").onclick = () => {
    const msg = isRec
      ? (o ? "Undo this payment?\n\n" + fmt(t.amount) + " comes back out of your current balance and "
             + o.label + " owes it again."
           : "Delete this payment? Your current balance drops by " + fmt(t.amount) + ".")
      : "Delete this " + (t.type === "add" ? "top-up" : "adjustment") + " of " + fmt(t.amount) + "?";
    if (!confirm(msg)) return;
    tombstone(t);
    if (o) stamp(syncOwed(state, o));
    closeDlg(); commit();
  };
}

function dlgOwedAdd(){
  openDlg("Add owed money",
    `<label><span>Who owes you / what for</span>
      <input name="label" type="text" autocomplete="off" placeholder="e.g. Rahul — dinner"></label>`
    + fAmount(null) + fDate(null) + fNote(null),
    fd => {
      const label = fd.get("label").trim(); if (!label) return "Add a name or label.";
      const amt = parseMoney(fd.get("amount")); if (amt == null) return "Enter an amount greater than zero.";
      const date = fd.get("date"); if (!date) return "Pick a date.";
      state.owed.push(stamp({ id:uid(), label, amount:amt, remaining:amt, dateAdded:date,
                        note:fd.get("note").trim(), status:"open", dateClosed:null }));
    });
}
/* Receiving moves owed money into current balance, so AVAILABLE is unchanged. */
function receive(o, amount, date){
  state.transactions.push(stamp({ id:uid(), type:"received", owedId:o.id, amount, date, note:o.label }));
  syncOwed(state, o);
  if (o.status === "received") o.dateClosed = date;
  stamp(o);
}

function dlgOwedEdit(o){
  if (!o) return;
  const got = receivedFor(state, o.id);
  openDlg("Edit owed entry",
    `<label><span>Who owes you / what for</span>
      <input name="label" type="text" autocomplete="off" value="${esc(o.label)}"></label>`
    + fAmount(o.amount) + fDate(o.dateAdded) + fNote(o.note)
    + (got ? `<p style="color:var(--muted);font-size:13px">${esc(fmt(got))} already received against this
        — edit or undo individual payments from the dashboard's balance history.</p>` : ""),
    fd => {
      const label = fd.get("label").trim(); if (!label) return "Add a name or label.";
      const amt = parseMoney(fd.get("amount")); if (amt == null) return "Enter an amount greater than zero.";
      if (amt < got) return "You've already received " + fmt(got) + " against this, so the total can't be less.";
      const date = fd.get("date"); if (!date) return "Pick a date.";
      o.label = label; o.amount = amt; o.dateAdded = date; o.note = fd.get("note").trim();
      stamp(syncOwed(state, o));
    },
    `<button type="button" class="btn danger spacer" data-del>Delete</button>`);
  dlg.querySelector("[data-del]").onclick = () => {
    if (!confirm(got ? "Delete this entry?\n\nThe " + fmt(got) + " you already received stays in your balance."
                     : "Delete this owed entry?")) return;
    tombstone(o);
    closeDlg(); commit();
  };
}
function dlgReceivePart(o){
  openDlg("Part payment from " + o.label,
    `<p style="color:var(--muted);font-size:13px;margin-top:0">Outstanding: ${esc(fmt(o.remaining))}</p>`
    + fAmount(null) + fDate(null),
    fd => {
      const amt = parseMoney(fd.get("amount"));
      if (amt == null) return "Enter an amount greater than zero.";
      if (amt > o.remaining) return "That's more than the " + fmt(o.remaining) + " outstanding.";
      const date = fd.get("date"); if (!date) return "Pick a date.";
      receive(o, amt, date);
    });
}

/* Essentials and laundry entries: same shape, different meaning. */
function dlgSide(type, existing){
  const meta = SIDE_META[type];
  const isCard = type === "card", owedBacked = meta.owedBacked;
  const title = (existing ? "Edit " : "Add ") + meta.noun;
  const intro = existing ? ""
    : owedBacked ? `<p style="color:var(--muted);font-size:13px;margin-top:0">Comes out of your current
        balance and adds an owed entry for the same amount, so available stays where it is.
        It won't touch your spending-per-day figures.</p>`
    : isCard ? `<p style="color:var(--muted);font-size:13px;margin-top:0">Lowers available now;
        your current balance only drops when you mark the charge paid.</p>`
            : `<p style="color:var(--muted);font-size:13px;margin-top:0">Comes out of your current
        balance. Available doesn't move while you're still within what you set aside
        (${esc(fmt(laundryBudget(state, curYm())))} this month).</p>`;
  openDlg(title,
    intro + fAmount(existing && existing.amount) + fDate(existing && existing.date)
    + `<label><span>What for${owedBacked || isCard ? "" : " (optional)"}</span>
        <input name="note" type="text" autocomplete="off"
          placeholder="${esc(meta.hint)}"
          value="${esc(existing ? existing.note : "")}"></label>`,
    fd => {
      const amt = parseMoney(fd.get("amount"));
      if (amt == null) return "Enter an amount greater than zero.";
      const date = fd.get("date"); if (!date) return "Pick a date.";
      const note = fd.get("note").trim();
      if (existing){
        stamp(Object.assign(existing, { amount:amt, date, note }));
      } else {
        state.transactions.push(stamp({ id:uid(), type, amount:amt, date, note }));
        if (owedBacked)   // the matching owed entry; independent from here on
          state.owed.push(stamp({ id:uid(), label: note || meta.owedLabel, amount:amt,
            remaining:amt, dateAdded:date, note:"From " + meta.plural.toLowerCase(),
            status:"open", dateClosed:null }));
        if (ymOf(date) !== ui.month) ui.month = ymOf(date);
      }
    },
    existing ? `<button type="button" class="btn danger spacer" data-del>Delete</button>` : "");
  if (existing) dlg.querySelector("[data-del]").onclick = () => {
    const effect = isCard && !existing.paid
      ? "Delete this? Your available balance goes back up by " + fmt(existing.amount)
        + " — nothing has left your current balance yet."
      : "Delete this? Your current balance goes back up by " + fmt(existing.amount)
        + (owedBacked ? ".\n\nThe owed entry it created stays — remove that separately if you want it gone." : ".");
    if (!confirm(effect)) return;
    tombstone(existing); closeDlg(); commit();
  };
}

/* Paying a charge moves it from "committed" to "gone": current drops, and the
   pending total drops by the same amount, so available doesn't move. */
function payCard(t){
  if (!t || t.paid) return;
  if (!confirm("Mark " + fmt(t.amount) + (t.note ? " (" + t.note + ")" : "")
      + " as paid?\n\nIt comes out of your current balance. Available stays where it is.")) return;
  t.paid = true; t.paidDate = todayStr(); stamp(t); commit();
}
function payAllCard(){
  const pending = txns(state).filter(t => t.type === "card" && !t.paid);
  if (!pending.length) return;
  const total = pending.reduce((a,t)=> a + t.amount, 0);
  if (!confirm("Pay the whole bill — " + fmt(total) + " across " + pending.length
      + " charge" + (pending.length === 1 ? "" : "s") + "?\n\n"
      + "It comes out of your current balance. Available stays where it is.")) return;
  const today = todayStr();
  for (const t of pending){ t.paid = true; t.paidDate = today; stamp(t); }
  commit();
}

function dlgLaundryBudget(){
  const ym = ui.month;
  const cur = laundryBudget(state, ym);
  openDlg("Set aside for " + monthLabel(ym),
    `<p style="color:var(--muted);font-size:13px;margin-top:0">Held back from available, but it
      stays in your current balance until you actually spend it. Later months inherit this
      amount until you change it.</p>`
    + `<label><span>Amount (₹)</span>
        <input class="amount-in" name="amount" type="text" inputmode="decimal"
          autocomplete="off" value="${esc(toInput(cur))}"></label>`,
    fd => {
      const amt = parseAmountOrZero(fd.get("amount"));
      if (amt == null || amt < 0) return "Enter an amount (0 to set nothing aside).";
      const row = (state.laundryBudgets || []).find(r => r.id === ym);
      if (row){ row.amount = amt; delete row.deleted; stamp(row); }
      else state.laundryBudgets.push(stamp({ id: ym, amount: amt }));
    });
}

/* ---------- saved lists of owed entries ---------- */
async function copyText(text, btn){
  try {
    await navigator.clipboard.writeText(text);
    if (btn){ const old = btn.textContent; btn.textContent = "Copied"; setTimeout(()=>{ btn.textContent = old; }, 1400); }
    return true;
  } catch(e){
    // Clipboard blocked (some browsers only allow it on a real tap) — show it to copy by hand.
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.cssText = "position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);"
      + "width:min(420px,90vw);height:180px;z-index:99;font:13px ui-monospace,monospace;padding:10px";
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch(e2){}
    ta.remove();
    if (!ok) alert("Couldn't copy automatically. The text is shown on the card — select and copy it.");
    return ok;
  }
}

function dlgMakeGroup(){
  const open = owedRows(state).filter(o => o.status === "open" && (ui.sel || []).indexOf(o.id) >= 0);
  if (!open.length) return;
  const items = open.map(o => ({ owedId:o.id, label:o.label, amount:o.remaining }));
  const total = items.reduce((a,i)=> a + i.amount, 0);
  const preview = items.map(i => i.label + " -> " + fmt(i.amount)).join("\n") + "\nTotal -> " + fmt(total);
  openDlg("Save this list",
    `<label><span>Name it (optional)</span>
      <input name="name" type="text" autocomplete="off" value="${esc(prettyDate(todayStr()))}"></label>
     <div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Text</div>
     <pre class="grouptext" style="margin-top:0">${esc(preview)}</pre>
     <p style="color:var(--muted);font-size:12.5px">Amounts are fixed at what they are now. Collecting
       the list later adds ${esc(fmt(total))} to your current balance and settles these entries.</p>`,
    fd => {
      const name = fd.get("name").trim() || prettyDate(todayStr());
      state.owedGroups.push(stamp({ id:uid(), name, items, total,
        createdAt: todayStr(), status:"open", collectedAt:null }));
      ui.sel = [];
    },
    `<button type="button" class="btn spacer" data-copy>Copy text</button>`);
  dlg.querySelector("[data-copy]").onclick = e => copyText(preview, e.target);
}

function collectGroup(g){
  if (!g || g.status === "collected") return;
  // Amounts are frozen, so flag anything that has moved since the list was made.
  const drift = [];
  for (const it of g.items){
    const o = owedRows(state).find(x => x.id === it.owedId);
    if (!o) drift.push(it.label + " — that entry no longer exists");
    else if (o.status !== "open") drift.push(it.label + " — already settled on its own");
    else if (o.remaining !== it.amount)
      drift.push(it.label + " — now " + fmt(o.remaining) + ", the list says " + fmt(it.amount));
  }
  let msg = "Collect " + fmt(g.total) + " for “" + g.name + "”?\n\n"
          + "It goes into your current balance and settles these entries.";
  if (drift.length) msg += "\n\nSince you saved this list:\n• " + drift.join("\n• ")
          + "\n\nIt will still collect the amounts shown on the list. Cancel if that's not right.";
  if (!confirm(msg)) return;
  const today = todayStr();
  for (const it of g.items){
    state.transactions.push(stamp({ id:uid(), type:"received", owedId:it.owedId,
      amount:it.amount, date:today, note:it.label }));
    const o = state.owed.find(x => x.id === it.owedId && !x.deleted);
    if (o) stamp(syncOwed(state, o));
  }
  g.status = "collected"; g.collectedAt = today; stamp(g);
  commit();
}

function doImport(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = () => {
    const file = inp.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      let d;
      try { d = migrate(JSON.parse(r.result)); }
      catch(e){ alert("That file isn't valid backup JSON."); return; }
      if (!d || !Array.isArray(d.transactions) || !Array.isArray(d.categories)){
        alert("That file doesn't look like an expense tracker backup."); return;
      }
      const has = "Backup has: " + txns(d).length + " transactions, " + catRows(d).length
        + " categories, " + owedRows(d).length + " owed entries, " + d.archive.length + " archived months.";
      const msg = state
        ? "Replace your current data with this backup?\n\n" + has + "\n"
          + "You currently have: " + txns(state).length + " transactions, "
          + catRows(state).length + " categories, " + owedRows(state).length + " owed entries, "
          + state.archive.length + " archived months.\n\nYour current data downloads as a backup first."
        : "Load this backup onto this device?\n\n" + has;
      if (!confirm(msg)) return;
      if (state) exportNow("before-import-" + todayStr());
      state = d; closeDlg(); commit();
    };
    r.readAsText(file);
  };
  inp.click();
}

/* ============================ EVENTS ============================ */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  const owedById = i => owedRows(state).find(o => o.id === i);

  switch (act){
    case "tab": ui.tab = id; render(); break;
    case "chip": ui.cat = id; render(); break;
    case "prevMonth": ui.month = shiftMonth(ui.month, -1); render(); break;
    case "nextMonth": ui.month = shiftMonth(ui.month, 1); render(); break;
    case "thisMonth": ui.month = curYm(); render(); break;
    case "viewMonth": ui.month = id; ui.cat = "all"; ui.tab = "exp"; render(); break;
    case "exportMonth": exportMonth(id); break;

    case "addExpense": dlgExpense(null); break;
    case "editExpense": dlgExpense(txns(state).find(t => t.id === id)); break;
    case "addEssential": dlgSide("essential", null); break;
    case "addReimbursed": dlgSide("reimbursed", null); break;
    case "addLaundry": dlgSide("laundry", null); break;
    case "addCard": dlgSide("card", null); break;
    case "payCard": payCard(txns(state).find(t => t.id === id)); break;
    case "payAllCard": payAllCard(); break;
    case "unpayCard": {
      const t = txns(state).find(x => x.id === id);
      if (t && confirm("Undo paying " + fmt(t.amount) + "?\n\nIt goes back to being an unpaid "
          + "charge: your current balance rises again and available is unchanged.")){
        t.paid = false; t.paidDate = null; stamp(t); commit();
      }
      break;
    }
    case "setLaundry": dlgLaundryBudget(); break;
    case "editSide": {
      const t = txns(state).find(x => x.id === id);
      if (t) dlgSide(t.type, t);
      break;
    }
    case "addMoney": dlgSimpleTxn("add"); break;
    case "adjust": dlgSimpleTxn("adjust"); break;
    case "editMin": case "settings":
      // Before setup there are no settings to show; offer the ways in instead.
      if (!state) dlgSync(); else dlgSettings();
      break;

    case "editTxn": dlgTxn(txns(state).find(x => x.id === id)); break;
    case "toggleHistory": ui.allHistory = !ui.allHistory; render(); break;
    case "addOwed": dlgOwedAdd(); break;
    case "editOwed": dlgOwedEdit(owedById(id)); break;
    case "clearSel": ui.sel = []; render(); break;
    case "makeGroup": dlgMakeGroup(); break;
    case "collectGroup": collectGroup(groupRows(state).find(g => g.id === id)); break;
    case "copyGroup": {
      const g = groupRows(state).find(x => x.id === id);
      if (g) copyText(groupText(g), el);
      break;
    }
    case "delGroup": {
      const g = groupRows(state).find(x => x.id === id);
      if (g && confirm("Remove the list “" + g.name + "”?\n\nThe owed entries in it are untouched"
          + (g.status === "collected" ? " and stay settled." : " — they stay open."))){
        tombstone(g); commit();
      }
      break;
    }
    case "reopenOwed": {
      const o = owedById(id);
      if (!o) break;
      const got = receivedFor(state, o.id);
      if (got >= o.amount){
        alert("This one is fully paid.\n\nTo reopen it, undo the payment in the dashboard's "
            + "balance history — that also takes the money back out of your current balance.");
        break;
      }
      if (!confirm("Reopen this? " + o.label + " owes you " + fmt(o.amount - got) + " again.")) break;
      o.status = "open"; o.dateClosed = null;
      stamp(syncOwed(state, o)); commit();
      break;
    }
    case "receiveFull": {
      const o = owedById(id);
      if (o && confirm("Got " + fmt(o.remaining) + " from " + o.label + "?\n\nThis adds it to your current balance — available stays the same."))
        { receive(o, o.remaining, todayStr()); commit(); }
      break;
    }
    case "receivePart": dlgReceivePart(owedById(id)); break;
    case "writeOff": {
      const o = owedById(id);
      if (o && confirm("Write off " + fmt(o.remaining) + " from " + o.label + "?\n\nNothing is added to your balance, so your available goes down.")){
        o.remaining = 0; o.status = "writtenOff"; o.dateClosed = todayStr(); stamp(o); commit();
      }
      break;
    }
    case "delOwed": {
      const o = owedById(id);
      if (o && confirm("Remove this from history? Money already received stays in your balance.")){
        tombstone(o); commit();
      }
      break;
    }

    case "addCat": {
      const inp = dlg.querySelector("[name=newcat]"), name = inp.value.trim();
      if (!name) return;
      if (catRows(state).some(c => c.name.toLowerCase() === name.toLowerCase())){ alert("That category already exists."); return; }
      state.categories.push(stamp({ id:uid(), name, builtin:false, archived:false }));
      queueSync(); Store.save(state); closeDlg(); dlgSettings(); break;
    }
    case "renameCat": {
      const c = state.categories.find(c => c.id === id);
      const name = prompt("Rename category", c.name);
      if (name && name.trim()){ c.name = name.trim(); stamp(c); queueSync(); Store.save(state); closeDlg(); dlgSettings(); }
      break;
    }
    case "archiveCat": {
      const c = state.categories.find(c => c.id === id);
      c.archived = !c.archived; stamp(c);
      if (c.archived && ui.cat === c.id) ui.cat = "all";
      queueSync(); Store.save(state); closeDlg(); dlgSettings(); break;
    }

    case "syncSetup": closeDlg(); dlgSync(); break;
    case "syncNow": Sync.run().then(()=>{ closeDlg(); dlgSettings(); }); break;
    case "linkFile": linkNewFile(); break;
    case "openFile": openExistingFile(); break;
    case "reconnect": reconnectFile(); break;
    case "unlinkFile": unlinkFile(); break;
    case "export": exportNow(); break;
    case "import": doImport(); break;
    case "doPendingBackup":
      exportNow(state.meta.pendingBackup + "-close");
      delete state.meta.pendingBackup; commit(); break;
    case "dismissBackup":
      delete state.meta.pendingBackup; commit(); break;
    case "reset":
      if (confirm("Erase ALL data and start over?\n\nA backup downloads first.")){
        exportNow("before-reset-" + todayStr());
        localStorage.removeItem(KEY);
        idbDel("state").catch(()=>{});
        state = null; closeDlg(); render();
      }
      break;

    case "doSetup": {
      const cur = parseAmountOrZero(document.getElementById("s-cur").value);
      const min = parseAmountOrZero(document.getElementById("s-min").value);
      if (cur == null || min == null){
        document.getElementById("s-err").textContent = "Enter both amounts (0 is fine)."; return;
      }
      state = freshState(cur, min);
      commit(); break;
    }
  }
});
